window.delUser=id=>{ 
  if(id===currentUser.id){toast("Operation blocked: Cannot delete active session");return;} 
  const target = DB.users.find(u=>u.id===id);
  if (target.role === 'superadmin') { toast("Operation blocked: Super Admin is protected"); return; }
  if (target.role === 'admin' && !isSuperAdmin()) { toast("Insufficient clearance to delete Admin"); return; }
  if(!confirm("Warning: Purging this account will permanently destroy their isolated data. Proceed?"))return; 
  DB.users=DB.users.filter(u=>u.id!==id); delete DB.profiles[id]; delete DB.perUser[id]; 
  save(true); render(); toast("Account successfully purged"); 
};

window.userModal=(id)=>{ 
  const u=id?DB.users.find(x=>x.id===id):null; const p=id?DB.profiles[id]:{};
  if (u && u.id !== currentUser.id && !isSuperAdmin() && u.role === 'superadmin') { toast("Insufficient clearance for this action."); return; }

  const d = data();
  const allRoles = Object.keys(DB.permissions);
  let roleOptions = allRoles.map(r => {
     if (!isSuperAdmin() && r === 'superadmin') return ''; 
     return `<option value="${r}"${u&&u.role===r?' selected':''}>${r.toUpperCase()}</option>`;
  }).join("");

  const coaches = d.coaches || []; const sups = d.supervisors || [];
  let linkedOptions = `<option value="">-- No Linked Profile --</option>`;
  linkedOptions += `<optgroup label="Supervisors">` + sups.map(s => `<option value="${s.id}"${u&&u.linkedId===s.id?' selected':''}>${esc(s.name)}</option>`).join("") + `</optgroup>`;
  linkedOptions += `<optgroup label="Coaches">` + coaches.map(c => `<option value="${c.id}"${u&&u.linkedId===c.id?' selected':''}>${esc(c.name)}</option>`).join("") + `</optgroup>`;

  showModal(`<div class="modal-head"><h3>${u?"Modify Configuration":"Provision Account"}</h3><button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button></div>
    <div class="form-group"><label>Display Alias</label><input id="u_name" value="${esc(p.displayName||"")}"></div>
    <div class="form-group"><label>Username</label><input id="u_user" value="${esc(u?u.username:"")}" ${u && !isSuperAdmin() ? "disabled":""}></div>
    <div class="form-group"><label>PIN</label><input id="u_pin" inputmode="numeric" value="${esc(u?u.pin:"")}"></div>
    <div class="form-group"><label>Security Level (Role)</label><select id="u_role" ${!isSuperAdmin() && u && u.id===currentUser.id ? "disabled" : ""}>${roleOptions}</select></div>
    <div class="form-group"><label>Linked Staff Profile (For Data Scoping)</label><select id="u_link">${linkedOptions}</select></div>
    <div class="modal-btns"><button class="btn btn-gray" onclick="closeModal()">Abort</button><button class="btn btn-primary" onclick='saveUser("${id||""}")'>Execute Provision</button></div>`);
};
window.saveUser=id=>{
  const name=$("u_name").value.trim(), pin=$("u_pin").value.trim();
  const usernameField = $("u_user").value.trim().toLowerCase();
  let role = $("u_role") ? $("u_role").value : 'user';
  const linkedId = $("u_link").value;

  if(pin.length<4){ toast("PIN must be at least 4 digits"); return; }
  if(id){ 
    const u=DB.users.find(x=>x.id===id); 
    if (u.id !== currentUser.id && !isSuperAdmin() && u.role === 'superadmin') { toast("You don't have permission to edit a superadmin account"); return; }
    if (!isSuperAdmin() && u.id === currentUser.id) role = u.role; 
    if (isSuperAdmin() && usernameField) {
        if(DB.users.some(x=>x.username===usernameField && x.id!==id)){ toast("Username already taken"); return; }
        u.username = usernameField;
    }
    u.pin=pin; u.role=role; u.linkedId=linkedId; DB.profiles[id].displayName=name||u.username; 
  } else { 
    if(!usernameField){toast("Username is required");return;} 
    if(DB.users.some(u=>u.username===usernameField)){toast("Username already taken");return;}
    const newU={id:usernameField,username:usernameField,pin,role,linkedId}; 
    DB.users.push(newU); 
    DB.profiles[usernameField]={displayName:name||usernameField,phone:"",email:"",bio:"",theme:"light",dateFormat:"UK"}; 
    DB.perUser[usernameField]={transactions:[],members:[],gifts:[],coaches:[],supervisors:[]}; 
  }
  save(true); closeModal(); render(); toast("Configuration applied");
};

      </div>
      <div class="card" style="margin-bottom:0"><div class="card-head"><span class="card-title">Preferences</span></div>
        <div class="form-group"><label>Date Format</label><select id="p_date"><option value="UK"${p.dateFormat==='UK'?' selected':''}>EU/UK (DD/MM/YYYY)</option><option value="US"${p.dateFormat==='US'?' selected':''}>US (MM/DD/YYYY)</option><option value="ISO"${p.dateFormat==='ISO'?' selected':''}>ISO (YYYY-MM-DD)</option></select></div>
        <div class="set-row" style="padding-top:0">
          <div><div style="font-weight:700;font-size:.9rem">Dark Mode</div><div class="desc">Switch the app to a dark color scheme</div></div>
          <label class="toggle"><input type="checkbox" id="p_dark" ${p.theme==='dark'?'checked':''} onchange="toggleDarkMode(this.checked)"><span class="slider"></span></label>
        </div>
        <button class="btn btn-blue" style="width:100%;margin-top:14px" onclick="savePrefs()">Save Preferences</button>
      </div>
    </div>`;
}
window.toggleDarkMode=(on)=>{ DB.profiles[currentUser.id].theme = on ? "dark" : "light"; applyTheme(); save(true); };
window.saveProfile=()=>{ const p=DB.profiles[currentUser.id]; p.displayName=$("p_name").value.trim()||currentUser.username; p.phone=$("p_phone").value.trim(); p.email=$("p_email").value.trim(); p.bio=$("p_bio").value.trim(); save(true); render(); toast("Profile updated"); };
window.savePrefs=()=>{ DB.profiles[currentUser.id].dateFormat=$("p_date").value; save(true); render(); toast("Preferences saved"); };

/* ===== Settings ===== */
function renderSettings(){
  $("pageBody").innerHTML=`
    <div class="card" style="max-width:600px;margin:0 auto"><div class="card-head"><span class="card-title"><i class="fas fa-key" style="color:var(--primary);margin-right:10px"></i> Change PIN</span></div>
      <div class="form-group"><label>Current PIN</label><input id="s_cur" inputmode="numeric" type="password"></div>
      <div class="form-group"><label>New PIN (4-6 Digits)</label><input id="s_new" inputmode="numeric" type="password"></div>
      <div class="form-group"><label>Confirm New PIN</label><input id="s_conf" inputmode="numeric" type="password"></div>
      <button class="btn btn-primary" style="width:100%;margin-top:10px" onclick="changePin()">Update PIN</button>
    </div>`;
}
window.changePin=()=>{
  const c=$("s_cur").value.trim(),n=$("s_new").value.trim(),cf=$("s_conf").value.trim();
  if(c!==currentUser.pin){ toast("Current PIN is incorrect"); return; }
  if(n.length<4){ toast("PIN must be at least 4 digits"); return; }
  if(n!==cf){ toast("PINs don't match"); return; }
  DB.users.find(u=>u.id===currentUser.id).pin=n; currentUser.pin=n; save(true); render(); toast("PIN updated successfully");
};

/* ===== Custom Sections (superadmin builds new pages on the fly) ===== */
const SECTION_ICONS = ["fa-folder","fa-briefcase","fa-graduation-cap","fa-calendar-check","fa-box","fa-truck","fa-store","fa-handshake","fa-clipboard-list","fa-map-marker-alt","fa-chart-line","fa-star"];
const FIELD_TYPES = ["text","textarea","number","date","select"];
const DEFAULT_CUSTOM_FIELDS = () => ([
  {key:'name', label:'Name', type:'text', required:true},
  {key:'phone', label:'Phone', type:'text'},
  {key:'email', label:'Email', type:'text'},
  {key:'notes', label:'Notes', type:'textarea'},
  {key:'status', label:'Status', type:'select', options:['active','inactive']}
]);
function renderSectionManager(){
  if(!isSuperAdmin()) { activePage = "dashboard"; render(); return; }
  const sections = DB.customSections || [];
  $("pageBody").innerHTML = `
    <div class="card"><div class="card-head"><span class="card-title">Create a New Section</span></div>
      <p style="font-size:.85rem;color:var(--text-muted);margin-bottom:16px;line-height:1.4">Add a brand-new page to the sidebar — like Club or Coaches — with its own list of records and its own access level per role. Starts with default fields (Name, Phone, Email, Notes, Status) — customize them any time after with "Fields".</p>
      <div class="form-group"><label>Section Name</label><input id="ns_label" placeholder="e.g. Trainers, Events, Vendors"></div>
      <div class="form-group"><label>Icon</label><select id="ns_icon">${SECTION_ICONS.map(i=>`<option value="${i}">${i.replace('fa-','').replace(/-/g,' ')}</option>`).join("")}</select></div>
      <button class="btn btn-primary" style="width:100%" onclick="createCustomSection()"><i class="fas fa-plus"></i> Create Section</button>
    </div>
    <div class="card"><div class="card-head"><span class="card-title">Existing Custom Sections</span></div>
      <div class="tbl-wrap">${sections.length ? `<table><thead><tr><th>Section</th><th>Fields</th><th>Records</th><th>Actions</th></tr></thead><tbody>${
        sections.map(cs=>`<tr>
          <td data-label="Section"><i class="fas ${cs.icon||'fa-folder'}" style="margin-right:8px;color:var(--primary)"></i><b>${esc(cs.label)}</b></td>
          <td data-label="Fields">${(cs.fields||[]).map(f=>esc(f.label)).join(", ")}</td>
          <td data-label="Records">${(data().custom?.[cs.id]||[]).length}</td>
          <td data-label="${t('actions')}"><button class="btn btn-sm btn-purple" onclick="fieldsModal('${cs.id}')"><i class="fas fa-list"></i> Fields</button> <button class="btn btn-sm btn-blue" onclick="go('${cs.id}')"><i class="fas fa-eye"></i> Open</button> <button class="btn btn-sm btn-red" onclick="deleteCustomSection('${cs.id}')"><i class="fas fa-trash"></i></button></td>
        </tr>`).join("")
      }</tbody></table>` : `<div class="empty"><i class="fas fa-folder-open"></i>No custom sections yet — create one above</div>`}</div>
      <p style="font-size:.8rem;color:var(--text-muted);margin-top:14px"><i class="fas fa-lock" style="margin-right:4px"></i>New sections start hidden for every role except Super Admin. Set who can view/edit each one in <b>Access Control</b>, or give an individual person access in <b>Individual Access</b>.</p>
    </div>`;
}
window.createCustomSection = () => {
  const label = $("ns_label").value.trim(); if(!label) return toast("Section name required");
  const id = "cs_" + label.toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"") + "_" + Math.random().toString(36).slice(2,6);
  const icon = $("ns_icon").value;
  if(!DB.customSections) DB.customSections = [];
  DB.customSections.push({id, label, icon, fields: DEFAULT_CUSTOM_FIELDS()});
  Object.keys(DB.permissions).forEach(role=>{ if(role!=='superadmin') DB.permissions[role][id] = "hidden"; });
  DB.shared.custom = DB.shared.custom || {}; DB.shared.custom[id] = [];
  Object.values(DB.perUser||{}).forEach(u=>{ u.custom = u.custom || {}; u.custom[id] = []; });
  save(true); toast(`"${label}" section created`); renderSectionManager();
};
window.deleteCustomSection = (id) => {
  const cs = (DB.customSections||[]).find(c=>c.id===id); if(!cs) return;
  if(!confirm(`Delete section "${cs.label}" and all ${(data().custom?.[id]||[]).length} of its records? This can't be undone.`)) return;
  DB.customSections = DB.customSections.filter(c=>c.id!==id);
  Object.keys(DB.permissions).forEach(role=>{ delete DB.permissions[role][id]; });
  delete DB.shared.custom?.[id];
  Object.values(DB.perUser||{}).forEach(u=>{ if(u.custom) delete u.custom[id]; });
  if(activePage===id) activePage="sectionmanager";
  save(true); toast(`"${cs.label}" deleted`); buildNav(); render();
};

// Field editor — lets you add/remove/rename fields on ANY section, whether it was just
// created or has existed (and had data) for a while. Renaming a field's label is safe;
// removing a field just stops showing/collecting it, existing records keep the old value.
let editingFields = [], editingSectionId = "";
window.fieldsModal = (sectionId) => {
  const cs = (DB.customSections||[]).find(c=>c.id===sectionId); if(!cs) return;
  editingSectionId = sectionId;
  editingFields = JSON.parse(JSON.stringify(cs.fields && cs.fields.length ? cs.fields : DEFAULT_CUSTOM_FIELDS()));
  renderFieldsModal(cs.label);
};
function renderFieldsModal(label){
  showModal(`
  <div class="modal-head"><h3>Fields for ${esc(label)}</h3><button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button></div>
  <p style="font-size:.8rem;color:var(--text-muted);margin-bottom:14px">These fields show up in the Add/Edit form and as columns in the list, for both new entries and old ones.</p>
  <div style="max-height:340px;overflow-y:auto">
  ${editingFields.map((f,i)=>`
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #f1f5f9">
      <input value="${esc(f.label)}" placeholder="Field label" style="flex:2;padding:8px;border-radius:8px;border:1px solid #cbd5e1" oninput="updateFieldLabel(${i},this.value)">
      <select style="flex:1;padding:8px;border-radius:8px;border:1px solid #cbd5e1" onchange="updateFieldType(${i},this.value)">
        ${FIELD_TYPES.map(t=>`<option value="${t}"${f.type===t?' selected':''}>${t}</option>`).join("")}
      </select>
      <button class="btn btn-sm btn-red" onclick="removeField(${i})" ${editingFields.length<=1?'disabled':''}><i class="fas fa-trash"></i></button>
    </div>
    ${f.type==='select'?`<div class="form-group" style="margin-top:-6px"><label style="font-size:.7rem">Options (comma-separated)</label><input value="${esc((f.options||[]).join(', '))}" oninput="updateFieldOptions(${i},this.value)"></div>`:''}
  `).join("")}
  </div>
  <button class="btn btn-gray" style="width:100%;margin:10px 0" onclick="addField()"><i class="fas fa-plus"></i> Add Field</button>
  <div class="modal-btns"><button class="btn btn-gray" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveFields()"><i class="fas fa-check"></i> Save Fields</button></div>`);
}
window.updateFieldLabel = (i,v) => { editingFields[i].label = v; editingFields[i].key = editingFields[i].key || slugKey(v); };
window.updateFieldType = (i,v) => { editingFields[i].type = v; if(v==='select' && !editingFields[i].options) editingFields[i].options=['active','inactive']; renderFieldsModal((DB.customSections||[]).find(c=>c.id===editingSectionId)?.label||''); };
window.updateFieldOptions = (i,v) => { editingFields[i].options = v.split(',').map(s=>s.trim()).filter(Boolean); };
window.addField = () => { editingFields.push({key:'field_'+nid(), label:'New Field', type:'text'}); renderFieldsModal((DB.customSections||[]).find(c=>c.id===editingSectionId)?.label||''); };
window.removeField = (i) => { editingFields.splice(i,1); renderFieldsModal((DB.customSections||[]).find(c=>c.id===editingSectionId)?.label||''); };
function slugKey(label){ return (label||'field').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'') || 'field'; }
window.saveFields = () => {
  const cs = (DB.customSections||[]).find(c=>c.id===editingSectionId); if(!cs) return;
  if(editingFields.some(f=>!f.label.trim())) return toast("Every field needs a label");
  cs.fields = editingFields.map(f=>({...f, key: f.key || slugKey(f.label)}));
  save(true); closeModal(); renderSectionManager(); toast("Fields updated");
};

// Generic list page reused by every custom section — columns and form fields come from
// the section's own configurable field list, so any section can look totally different.
let customSearch="";
window.setCustomSearch=(v)=>{ customSearch=v.toLowerCase(); renderCustomSectionResults((DB.customSections||[]).find(c=>c.id===activePage)); };
function renderCustomSection(cs){
  const writeBtn = canWrite(cs.id) ? `<button class="btn btn-primary" onclick="customItemModal('${cs.id}')"><i class="fas fa-plus"></i> Add Entry</button>` : '';

  $("pageBody").innerHTML = switcher() + `
    <div class="card"><div class="card-head"><span class="card-title">${esc(cs.label)}</span>${writeBtn}</div>
      <input id="search_custom" class="search" placeholder="Search ${esc(cs.label).toLowerCase()}..." value="${esc(customSearch)}" oninput="setCustomSearch(this.value)">
      <div class="tbl-wrap" id="custom_results"></div>
    </div>`;
  renderCustomSectionResults(cs);
}
function renderCustomSectionResults(cs){
  if(!cs) return;
  const fields = (cs.fields && cs.fields.length) ? cs.fields : DEFAULT_CUSTOM_FIELDS();
  const d = data(); d.custom = d.custom || {}; d.custom[cs.id] = d.custom[cs.id] || [];
  let rows = [...d.custom[cs.id]];
  const nameField = fields.find(f=>f.key==='name') ? 'name' : fields[0].key;
  if(customSearch) rows = rows.filter(r=>(r[nameField]||"").toLowerCase().includes(customSearch));

  const el = $("custom_results"); if(!el) return;
  el.innerHTML = rows.length ? `
        <table><thead><tr>${fields.map(f=>`<th>${esc(f.label)}</th>`).join("")}${canWrite(cs.id)?'<th>Actions</th>':''}</tr></thead><tbody>`+
        rows.map(r=>`<tr>
          ${fields.map((f,fi)=>{
            const val = r[f.key];
            if(f.key==='status') return `<td data-label="${esc(f.label)}"><span class="badge ${val==='active'?'bg-green':'bg-gray'}">${esc(val||'active')}</span></td>`;
            if(f.key==='phone' && val) return `<td data-label="${esc(f.label)}"><div style="display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end"><span style="white-space:nowrap">${esc(val)}</span><a href="tel:${esc(val)}" class="btn btn-sm btn-blue" style="padding:4px 8px;border-radius:6px;min-width:28px"><i class="fas fa-phone"></i></a></div></td>`;
            if(f.key==='email' && val) return `<td data-label="${esc(f.label)}"><div style="display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end"><span style="white-space:nowrap">${esc(val)}</span><a href="mailto:${esc(val)}" class="btn btn-sm btn-amber" style="padding:4px 8px;border-radius:6px;min-width:28px"><i class="fas fa-envelope"></i></a></div></td>`;
            const label = fi===0 ? `<div style="font-weight:700;color:var(--text)">${esc(val||"-")}</div>${r.lastEditedBy?`<div style="font-size:.7rem;color:var(--text-muted);margin-top:4px"><i class="fas fa-user-edit" style="font-size:.65rem;margin-right:3px"></i>${esc(r.lastEditedBy)}</div>`:''}` : esc(val||"-");
            return `<td data-label="${esc(f.label)}">${label}</td>`;
          }).join("")}
          ${canWrite(cs.id)?`<td data-label="${t('actions')}"><button class="btn btn-sm btn-gray" onclick='customItemModal("${cs.id}",${sj(r)})'><i class="fas fa-pen"></i></button> <button class="btn btn-sm btn-red" onclick="delCustomItem('${cs.id}','${r.id}')"><i class="fas fa-trash"></i></button></td>`:''}
        </tr>`).join("")+`</tbody></table>` : `<div class="empty"><i class="fas ${cs.icon||'fa-folder'}"></i>No entries yet in ${esc(cs.label)}</div>`;
}
window.customItemModal = (sectionId, r={}) => {
  const cs = (DB.customSections||[]).find(c=>c.id===sectionId);
  const fields = (cs?.fields && cs.fields.length) ? cs.fields : DEFAULT_CUSTOM_FIELDS();
  const inputHtml = fields.map(f=>{
    const val = r[f.key] || "";
    if(f.type==='textarea') return `<div class="form-group"><label>${esc(f.label)}</label><textarea id="cu_${f.key}">${esc(val)}</textarea></div>`;
    if(f.type==='select') return `<div class="form-group"><label>${esc(f.label)}</label><select id="cu_${f.key}">${(f.options||[]).map(o=>`<option value="${esc(o)}"${val===o?' selected':''}>${esc(o)}</option>`).join("")}</select></div>`;
    if(f.type==='number') return `<div class="form-group"><label>${esc(f.label)}</label><input id="cu_${f.key}" type="number" value="${esc(val)}"></div>`;
    if(f.type==='date') return `<div class="form-group"><label>${esc(f.label)}</label><input id="cu_${f.key}" type="date" value="${esc(val)}"></div>`;
    return `<div class="form-group"><label>${esc(f.label)}</label><input id="cu_${f.key}" value="${esc(val)}"></div>`;
  }).join("");
  showModal(`
  <div class="modal-head"><h3>${r.id?"Edit":"Add"} ${esc(cs?.label||"Entry")}</h3><button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button></div>
  ${inputHtml}
  <div class="modal-btns"><button class="btn btn-gray" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick='saveCustomItem("${sectionId}","${r.id||""}")'>Save</button></div>`);
};
window.saveCustomItem = (sectionId, id) => {
  const cs = (DB.customSections||[]).find(c=>c.id===sectionId);
  const fields = (cs?.fields && cs.fields.length) ? cs.fields : DEFAULT_CUSTOM_FIELDS();
  const item = { id: id||nid(), ownerId: viewingAs||currentUser.id, lastEditedBy: getEditor() };
  for(const f of fields){
    const el = $("cu_"+f.key); const val = el ? el.value.trim() : "";
    if(f.required && !val) return toast(`${f.label} is required`);
    item[f.key] = val;
  }
  const d = data(); d.custom = d.custom || {}; d.custom[sectionId] = d.custom[sectionId] || [];
  const i = d.custom[sectionId].findIndex(x=>x.id===item.id);
  if(i>=0) d.custom[sectionId][i]={...d.custom[sectionId][i], ...item}; else d.custom[sectionId].push(item);
  save(true); closeModal(); render(); toast(id?"Entry updated":"Entry added");
};
window.delCustomItem = (sectionId, id) => {
  showModal(`
    <div class="modal-head"><h3>${t('confirmDeleteTitle')}</h3><button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button></div>
    <p style="font-size:.9rem;color:var(--text-muted);margin-bottom:20px;line-height:1.5">${t('confirmDeleteEntryMsg')}</p>
    <div class="modal-btns"><button class="btn btn-gray" onclick="closeModal()">${t('cancel')}</button><button class="btn btn-red" onclick="performDeleteCustom('${sectionId}','${id}')"><i class="fas fa-trash"></i> ${t('delete')}</button></div>
  `);
};
window.performDeleteCustom = (sectionId, id) => {
  closeModal();
  const d = data();
  const idx = (d.custom[sectionId]||[]).findIndex(x=>x.id===id);
  if(idx<0) return;
  const item = d.custom[sectionId][idx];
  d.custom[sectionId].splice(idx,1);
  save(true); render();
  showUndoToast("Entry deleted.", ()=>{
    const d2=data(); d2.custom[sectionId].splice(Math.min(idx, d2.custom[sectionId].length), 0, item); save(true); render(); toast("Restored");
  });
};

/* ===== Modal plumbing ===== */
function showModal(html){ $("modalRoot").innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`; }
window.closeModal=()=>{ $("modalRoot").innerHTML=""; };

/* ===== Start ===== */
load(); startCloud();
// If the last session ended before its edit finished syncing (app closed/crashed/offline),
// push it now so nothing gets silently overwritten by the next cloud snapshot.
if(isDirty) cloudSave(true);
const sess=sessionStorage.getItem("mm_session") || localStorage.getItem("mm_remembered_session");
if(sess){ 
    const u=DB.users.find(x=>x.id===sess); 
    if(u){ 
        currentUser=u; viewingAs=u.id; 
        sessionStorage.setItem("mm_session", u.id); 
        $("loginPage").classList.add("hidden"); 
        $("appShell").classList.remove("hidden"); 
        buildNav(); 
        render(); 
    } else {
        sessionStorage.removeItem("mm_session"); 
        localStorage.removeItem("mm_remembered_session");
        document.documentElement.classList.remove("authed");
    }
}
</script>
</body>
</html>
