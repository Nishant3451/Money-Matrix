<script>
  if (sessionStorage.getItem("mm_session") || localStorage.getItem("mm_remembered_session")) {
    document.documentElement.classList.add("authed");
  }

<style>
  :root {
    --primary: #146356;
    --primary-hover: #0E4A40;
    --primary-gradient: #146356;
    --gold: #B98A2E;
    --gold-hover: #9C7326;
    --gold-gradient: #B98A2E;
    --bg: #F3F7F5;
    --surface: #ffffff;
    --text: #101014;
    --text-muted: #6B7280;
    --border: #E5E5EC;
    --card-shadow: none;
    --hover-shadow: none;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Manrope', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html, body { overflow-x: hidden; }
  body{font-family:var(--font-body);background:var(--bg);color:var(--text);letter-spacing:-0.01em;min-height:100vh}
  .hidden{display:none!important}
  button, a {font-family:inherit;cursor:pointer;border:none;outline:none;text-decoration:none}
  input,select,textarea{font-family:inherit;font-size:15px;outline:none;transition:border-color .15s ease;color:var(--text)}
  input:focus,select:focus,textarea:focus{border-color:var(--primary)!important;box-shadow:0 0 0 3px rgba(67,56,202,.12)}
  button:focus-visible, a:focus-visible, .nav-item:focus-visible, .seg-btn:focus-visible { box-shadow:0 0 0 3px rgba(67,56,202,.35); border-radius:6px; }

  html.authed #loginPage { display: none !important; }
  html.authed #appShell { display: block !important; }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #D4D4DC; border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: #B0B0BC; }

  /* Sidebar - flat, no gradient glow */
  .sidebar{width:246px;background:#101014;position:fixed;left:0;top:0;bottom:0;color:#fff;padding:20px 0 0;transition:transform .25s ease;z-index:101;border-right:1px solid #1E1E24;display:flex;flex-direction:column}
  .sidebar-backdrop{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:99}
  .topbar-logout-btn{display:none;width:34px;height:34px;border-radius:8px;background:#F1F1F5;color:#6B7280;align-items:center;justify-content:center;border:1px solid var(--border);flex-shrink:0}
  .topbar-logout-btn:hover{background:#FCE8E8;color:#DC2626}
  .nav-scroll{flex:1;overflow-y:auto;padding-bottom:12px}
  .nav-scroll::-webkit-scrollbar { width: 4px; }
  .nav-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); }

  .sidebar-brand{padding:0 22px 20px;border-bottom:1px solid #1E1E24;margin-bottom:6px}
  .sidebar-brand h1{font-family:var(--font-display);font-size:1.35rem;font-weight:700;color:#fff;letter-spacing:-.5px;display:flex;align-items:center;gap:8px}
  .sidebar-brand h1 i{color:var(--gold)}
  .sidebar-brand p{font-size:.65rem;color:#75757F;margin-top:4px;text-transform:uppercase;letter-spacing:1.5px;font-weight:700}
  .nav-section-lbl{font-size:.62rem;font-weight:800;color:#54545E;text-transform:uppercase;letter-spacing:1px;padding:16px 22px 6px}
  .nav-scroll>.nav-section-lbl:first-child{padding-top:12px}
  .nav-item{padding:10px 22px;cursor:pointer;transition:all .15s ease;display:flex;align-items:center;gap:11px;border-left:2px solid transparent;font-size:.85rem;color:#9A9AA5;font-weight:600}
  .nav-item:hover{background:#18181D;color:#fff}
  .nav-item.active{background:#18181D;border-left-color:var(--gold);color:#fff}
  .nav-item.active i{color:var(--gold)}
  .nav-item i{width:18px;text-align:center;font-size:1rem}

  .sidebar-footer{display:flex;align-items:center;gap:10px;padding:14px 16px;border-top:1px solid #1E1E24;background:#0B0B0E;flex-shrink:0}
  .sidebar-footer-avatar{width:36px;height:36px;border-radius:8px;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem;flex-shrink:0}
  .sidebar-footer-info{flex:1;min-width:0}
  .sidebar-footer-name{font-size:.8rem;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sidebar-footer-role{font-size:.65rem;color:#75757F;text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin-top:1px}
  .sidebar-logout-btn{width:30px;height:30px;border-radius:7px;background:#18181D;color:#9A9AA5;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.85rem}
  .sidebar-logout-btn:hover{background:#DC2626;color:#fff}

  .main{margin-left:246px;padding:22px;min-height:100vh;max-width:1400px;margin-right:auto;overflow-x:hidden}

  /* Topbar - flat, no blur */
  .topbar{background:var(--surface);padding:16px 22px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;border:1px solid var(--border);position:sticky;top:14px;z-index:90}
  .topbar-header { display: flex; align-items: center; gap: 12px; }
  .topbar-title-block{min-width:0;overflow:hidden}
  .topbar h2{font-family:var(--font-display);font-size:1.25rem;font-weight:700;letter-spacing:-0.4px;line-height:1.2}
  .topbar-overline{font-size:.66rem;font-weight:800;color:var(--gold);text-transform:uppercase;letter-spacing:1px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar-right{display:flex;align-items:center;gap:10px;font-size:.85rem;flex-wrap:wrap}
  .topbar-user{display:flex;align-items:center;gap:8px;padding-left:10px;border-left:1px solid var(--border)}
  .topbar-user-avatar{width:28px;height:28px;border-radius:7px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.7rem;flex-shrink:0}
  .topbar-user span{font-weight:700;font-size:.85rem;color:var(--text)}
  .menu-btn { display: none; background: transparent; color: var(--text); font-size: 1.3rem; padding: 4px; border-radius: 6px; cursor: pointer; }
  .menu-btn:hover { color: var(--primary); }

  .pill{padding:4px 11px;border-radius:6px;font-size:.66rem;font-weight:700;letter-spacing:.4px;text-transform:uppercase;white-space:nowrap;border:1px solid var(--border)}
  .pill-blue{background:#EAF1EF;color:#146356;border-color:#C7DCD5}
  .pill-purple{background:#FBF3E4;color:#9C7326;border-color:#EAD9B4}

  .switcher{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;align-items:center;background:var(--surface);padding:8px 14px;border-radius:10px;border:1px solid var(--border)}
  .switcher .lbl{font-size:.72rem;color:var(--text-muted);margin-right:6px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
  .chip{padding:6px 14px;border-radius:6px;font-size:.78rem;border:1px solid var(--border);background:var(--bg);transition:all .15s ease;font-weight:600;color:var(--text)}
  .chip:hover{border-color:var(--primary);color:var(--primary)}
  .chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}

  /* Cards - flat, hairline border, no shadow */
  .card{background:var(--surface);border-radius:10px;padding:22px;border:1px solid var(--border);border-top:2px solid var(--primary);margin-bottom:22px}
  .card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--border)}
  .card-title{font-family:var(--font-display);font-size:1.1rem;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px;letter-spacing:-.3px}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:22px}
  .dash-hero{display:block;background:#101014;color:#fff;border-radius:12px;padding:24px 26px;margin-bottom:22px}
  .dash-hero-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
  .dash-hero-greeting{font-family:var(--font-display);font-size:1.4rem;font-weight:700;letter-spacing:-.4px}
  .dash-hero-date{font-size:.8rem;color:#9A9AA5;margin-top:4px;font-weight:600}
  .dash-hero-toolbar{display:flex;align-items:center;gap:8px;margin-top:16px}
  .dash-hero-search{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:9px 14px;flex:1;min-width:0}
  .dash-hero-search i{color:#9A9AA5;font-size:.85rem;flex-shrink:0}
  .dash-hero-search input{background:transparent;border:none;color:#fff;font-size:.85rem;width:100%;min-width:0}
  .dash-hero-search input::placeholder{color:#75757F}
  .dash-hero-badge{background:var(--gold);color:#fff;padding:7px 14px;border-radius:7px;font-size:.7rem;font-weight:800;letter-spacing:.5px;display:flex;align-items:center;gap:7px}
  .dash-quick-toggle{width:34px;height:34px;border-radius:7px;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:800;flex-shrink:0}
  .dash-quick-toggle:hover{background:rgba(255,255,255,.18)}
  .dash-sync-status{display:flex;align-items:center;gap:7px;font-size:.72rem;color:#9A9AA5;font-weight:600}
  .stat{background:var(--surface);border-radius:8px;padding:16px 18px;border:1px solid var(--border);border-left:3px solid var(--primary);display:flex;align-items:center;gap:14px}
  .stat:hover{border-left-color:var(--gold)}
  .stat-ic{width:36px;height:36px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:.95rem;flex-shrink:0}
  .ic-green{background:#E5F6EA;color:#16A34A}
  .ic-blue{background:#DCE9F5;color:#2A5C8A}
  .ic-amber{background:#FCF1DD;color:#B45309}
  .ic-red{background:#FCE8E8;color:#DC2626}
  .ic-purple{background:#F6E9CB;color:#9C7326}
  .ic-teal{background:#D3ECE6;color:#146356}
  .stat-info{flex:1}
  .stat-val{font-family:var(--font-mono);font-size:1.25rem;font-weight:700;line-height:1.2;color:var(--text);letter-spacing:-0.5px}
  .stat-lbl{font-size:.72rem;color:var(--text-muted);font-weight:700;margin-top:3px;text-transform:uppercase;letter-spacing:.4px}

  /* Buttons - flat solid, no gradients */
  .btn{padding:9px 15px;border-radius:7px;font-size:.82rem;font-weight:700;transition:all .12s ease;display:inline-flex;align-items:center;justify-content:center;gap:6px;letter-spacing:.1px;white-space:nowrap}
  .btn:active{transform:scale(0.97)}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:hover{background:var(--primary-hover)}
  .btn-blue{background:#2A5C8A;color:#fff}
  .btn-blue:hover{background:#1E4666}
  .btn-amber{background:#B7791F;color:#fff}
  .btn-amber:hover{background:#96610D}
  .btn-whatsapp{background:#128C7E;color:#fff}
  .btn-whatsapp:hover{background:#0D6E63}
  .btn-red{background:#DC2626;color:#fff}
  .btn-red:hover{background:#B91C1C}
  .btn-gray{background:#F1F1F5;color:#4B4B57;border:1px solid var(--border)}
  .btn-gray:hover{background:#E5E5EC;color:#101014}
  .btn-purple{background:var(--gold);color:#fff}
  .btn-purple:hover{background:var(--gold-hover)}
  .btn-sm{padding:5px 11px;font-size:.72rem;border-radius:6px}

  .search{width:100%;padding:9px 13px;border:1px solid var(--border);border-radius:7px;margin-bottom:12px;background:#fff}
  .filter-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;background:#F1F1F5;padding:8px;border-radius:8px;border:1px solid var(--border)}
  .filter-row .search{margin-bottom:0;flex:1;background:var(--surface)}
  .filter-row select{padding:9px 13px;border:1px solid var(--border);border-radius:7px;background:#fff;min-width:140px;font-weight:500}

  table{width:100%;border-collapse:separate;border-spacing:0}
  th,td{padding:11px 10px;text-align:left;font-size:.83rem}
  th{background:#F1F1F5;font-weight:700;color:#4B4B57;text-transform:uppercase;letter-spacing:.6px;font-size:.64rem;border-bottom:2px solid var(--border)}
  td{border-bottom:1px solid #EEEEF2;color:#1A1A20;vertical-align:middle}
  tr{transition:background .1s}
  tr:hover td{background:#FAFAFC}
  .tbl-wrap{overflow-x:auto;border-radius:8px;border:1px solid var(--border)}
  .row-avatar{width:32px;height:32px;border-radius:8px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.72rem;flex-shrink:0}

  .badge{padding:3px 9px;border-radius:5px;font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.4px;display:inline-flex;align-items:center;justify-content:center}
  .bg-green{background:#E5F6EA;color:#16A34A;border:1px solid #C3EBCD}
  .bg-amber{background:#FCF1DD;color:#B45309;border:1px solid #F5DCA8}
  .bg-gray{background:#F1F1F5;color:#4B4B57;border:1px solid #DEDEE5}
  .bg-purple{background:#F6E9CB;color:#9C7326;border:1px solid #EAD298}
  .bg-red{background:#FCE8E8;color:#DC2626;border:1px solid #F5C6C6}

  .empty{text-align:center;padding:50px 20px;color:var(--text-muted)}
  .empty i{font-size:1.4rem;width:56px;height:56px;line-height:56px;border-radius:50%;background:var(--bg);border:1px solid var(--border);margin-bottom:14px;display:inline-block;color:var(--primary)}

  .skel-line,.skel-block{background:linear-gradient(90deg,#EEEEF2 25%,#F5F5F8 37%,#EEEEF2 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite;border-radius:6px}
  .skel-line{height:14px;margin-bottom:12px}
  .skel-block{border-radius:10px}
  @keyframes shimmer{0%{background-position:100% 50%}100%{background-position:0 50%}}

  /* Dark mode — Graphite & Sapphire: one accent color, not three fighting for attention */
  html[data-theme="dark"]{
    --bg:#0A0C10; --surface:#15181F; --text:#EDEEF2; --text-muted:#868C9A; --border:#262A34;
    --primary:#D97706; --primary-hover:#B45309; --primary-gradient:#D97706;
    --gold:#F59E0B; --gold-hover:#D97706; --gold-gradient:#F59E0B;
  }
  html[data-theme="dark"] body::before{display:none}
  html[data-theme="dark"] .skel-line,html[data-theme="dark"] .skel-block{background:linear-gradient(90deg,#1B1F29 25%,#252A37 37%,#1B1F29 63%);background-size:400% 100%}
  html[data-theme="dark"] .topbar{background:#15181F}
  html[data-theme="dark"] th{background:#1B1F29;color:#9BA2B4}
  html[data-theme="dark"] td{border-bottom:1px solid #1F232C;color:#EDEEF2}
  html[data-theme="dark"] tr{background:#15181F}
  html[data-theme="dark"] tr:hover td{background:#1B1F29}
  html[data-theme="dark"] .filter-row{background:#181B23;border-color:#262A34}
  html[data-theme="dark"] .search,html[data-theme="dark"] .filter-row select{background:#1B1F29;border-color:#2E3341;color:#EDEEF2}
  html[data-theme="dark"] .form-group input,html[data-theme="dark"] .form-group select,html[data-theme="dark"] .form-group textarea{background:#1B1F29;border-color:#2E3341;color:#EDEEF2}
  html[data-theme="dark"] .modal{background:#15181F;border-color:#262A34}
  html[data-theme="dark"] .modal-close{background:#1B1F29;color:#868C9A}
  html[data-theme="dark"] .btn-gray{background:#1B1F29;color:#9BA2B4;border-color:#2E3341}
  html[data-theme="dark"] .btn-gray:hover{background:#252A37;color:#fff}
  html[data-theme="dark"] .perm-row{background:#15181F;border-color:#262A34}
  html[data-theme="dark"] .seg-toggle{background:#1B1F29;border-color:#262A34}
  html[data-theme="dark"] .seg-btn{color:#868C9A}
  html[data-theme="dark"] .seg-btn.active{background:#252A37;color:#F59E0B;border-color:#2E3341}
  html[data-theme="dark"] .empty i{background:#1B1F29;border-color:#262A34;color:#D97706}
  html[data-theme="dark"] .tbl-wrap{border-color:#262A34}
  html[data-theme="dark"] .alert-box{background:#15181F;border-color:#3A2F10;border-left-color:#D97706}
  html[data-theme="dark"] .alert-head{color:#F0B448}
  html[data-theme="dark"] .alert-item{background:#1B1F29;border-color:#332812;color:#E8B168}
  html[data-theme="dark"] .pill-blue{background:#1B1F29;color:#F59E0B;border-color:#2E3341}
  html[data-theme="dark"] .pill-purple{background:#1B1F29;color:#F59E0B;border-color:#2E3341}
  html[data-theme="dark"] .bg-purple{background:#1B1F29;color:#F59E0B;border-color:#2E3341}
  html[data-theme="dark"] .bg-gray{background:#1B1F29;color:#9BA2B4;border-color:#2E3341}
  html[data-theme="dark"] .ic-purple{background:#1B1F29;color:#F59E0B}
  html[data-theme="dark"] .ic-teal{background:#1B1F29;color:#D97706}
  html[data-theme="dark"] .ic-blue{background:#1B1F29;color:#F59E0B}
  html[data-theme="dark"] .toast{background:#15181F;border-color:#262A34}
  html[data-theme="dark"] .dash-hero{background:#0F1218}
  html[data-theme="dark"] .sidebar{background:#0A0C10;border-color:#1B1F29}
  html[data-theme="dark"] .sidebar-brand{border-color:#1B1F29}
  html[data-theme="dark"] .nav-item:hover{background:#15181F}
  html[data-theme="dark"] .nav-item.active{background:#15181F;border-left-color:#D97706}
  html[data-theme="dark"] .nav-item.active i{color:#D97706}
  html[data-theme="dark"] .sidebar-footer{background:#0A0C10;border-color:#1B1F29}
  html[data-theme="dark"] .nav-section-lbl{color:#454B59}
  /* Premium depth: one blue glow used sparingly, not stacked everywhere */
  html[data-theme="dark"] .card{box-shadow:0 1px 2px rgba(0,0,0,.4);background:#15181F}
  html[data-theme="dark"] .card-head{border-color:#20242E}
  html[data-theme="dark"] .stat{background:#15181F;box-shadow:0 1px 2px rgba(0,0,0,.3)}
  html[data-theme="dark"] .stat:hover{border-left-color:#D97706}
  html[data-theme="dark"] .stat-val{color:#F5F6F9}
  html[data-theme="dark"] .btn-primary{box-shadow:0 4px 14px -4px rgba(59,130,246,.5)}
  html[data-theme="dark"] .btn-primary:hover{box-shadow:0 6px 18px -4px rgba(59,130,246,.65)}
  html[data-theme="dark"] .btn-purple{box-shadow:0 4px 14px -4px rgba(96,165,250,.4)}
  html[data-theme="dark"] .btn-purple:hover{box-shadow:0 6px 18px -4px rgba(96,165,250,.55)}
  html[data-theme="dark"] .dash-hero{border:1px solid #1B1F29}
  html[data-theme="dark"] .dash-hero-search{background:#1B1F29;border-color:#2E3341}
  html[data-theme="dark"] .dash-quick-toggle{background:#1B1F29;border-color:#2E3341}
  html[data-theme="dark"] .dash-quick-toggle:hover{background:#252A37}
  html[data-theme="dark"] .login{background:#0A0C10}
  html[data-theme="dark"] .row-avatar{box-shadow:none}
  html[data-theme="dark"] .modal{box-shadow:0 30px 70px -20px rgba(0,0,0,.6), 0 0 0 1px #20242E}
  html[data-theme="dark"] ::-webkit-scrollbar-thumb{background:#2A2F3B}
  html[data-theme="dark"] ::-webkit-scrollbar-thumb:hover{background:#3B4152}

let currentUser=null, viewingAs=null, activePage="dashboard";
let dismissedAlertsArray = JSON.parse(sessionStorage.getItem("mm_dismissed_alerts") || "[]");

let isDirty = localStorage.getItem("mm_dirty") === "true";
let applyingRemote = false;
let lastCloudJson = "";
let writeTimer = null;

function save(immediate = false){ 
  localStorage.setItem("mm_dirty", "true");
  isDirty = true;
  localStorage.setItem(STORE, JSON.stringify(DB)); 
  cloudSave(immediate); 
}

function cloudSave(immediate = false){ 
  if(!firebaseAvailable){ localStorage.setItem("mm_dirty","false"); isDirty=false; setSync("Local mode — no cloud sync",true); return; }
  if(applyingRemote) return; 
  clearTimeout(writeTimer); 
  const jsonStr = JSON.stringify(DB);
  lastCloudJson = jsonStr; 
  const payload = { json: jsonStr }; 
  const pushToCloud = () => {
    setDoc(DOC, payload).then(() => {
        localStorage.setItem("mm_dirty", "false");
        isDirty = false;
    }).catch(e=>setSync("Save error",true));
  };
  if(immediate) pushToCloud();
  else writeTimer = setTimeout(pushToCloud, 400); 
}

function load(){ 
  try { const s=localStorage.getItem(STORE); if(s) DB={...DB,...JSON.parse(s)}; } catch(e){} 
  ensure(); 
}
function ensure(){
  if(!DB.activityLog) DB.activityLog = [];
  if(!DB.settings.formula1Flavors) DB.settings.formula1Flavors = ["Vanilla","Orange"];
  if(!DB.settings.afreshFlavors) DB.settings.afreshFlavors = ["Lemon","Wild Berry"];
  if (!DB.users.some(u => u.role === 'superadmin')) {
    DB.users.unshift({id:"bos_rajkot",username:"bos_rajkot",pin:"9999",role:"superadmin"});
    if (!DB.profiles["bos_rajkot"]) DB.profiles["bos_rajkot"] = {displayName:"BOS RAJKOT",phone:"",email:"",bio:"",theme:"light",dateFormat:"UK"};
    if (!DB.perUser["bos_rajkot"]) DB.perUser["bos_rajkot"] = {transactions:[],members:[],gifts:[],coaches:[],supervisors:[]};
  }
  if (!DB.permissions || Object.keys(DB.permissions).length === 0 || !DB.permissions.superadmin) {
    DB.permissions = {
      superadmin: { dashboard:"write", marathon:"write", club:"write", coaches:"write", supervisors:"write", gifts:"write", worldteam:"write", getteam:"write", milteam:"write", presteam:"write", backup:"write" },
      admin: { dashboard:"write", marathon:"write", club:"write", coaches:"write", supervisors:"write", gifts:"write", worldteam:"write", getteam:"write", milteam:"write", presteam:"write", backup:"write" },
      user: { dashboard:"view", marathon:"write", club:"write", coaches:"view", supervisors:"view", gifts:"view", worldteam:"view", getteam:"view", milteam:"view", presteam:"view", backup:"hidden" }
    };
  }
  
  DB.users.forEach(u=>{
    if(!DB.permissions[u.role]) {
       DB.permissions[u.role] = { dashboard:"view", marathon:"hidden", club:"hidden", coaches:"hidden", supervisors:"hidden", gifts:"hidden", worldteam:"view", getteam:"view", milteam:"view", presteam:"view", backup:"hidden" };
    }
    if(!DB.profiles[u.id]) DB.profiles[u.id]={displayName:u.username,phone:"",email:"",bio:"",theme:"light",dateFormat:"UK"};
    if(!DB.perUser[u.id]) DB.perUser[u.id]={transactions:[],members:[],gifts:[],coaches:[],supervisors:[],custom:{}};
    else {
      if(!DB.perUser[u.id].coaches) DB.perUser[u.id].coaches=[];
      if(!DB.perUser[u.id].supervisors) DB.perUser[u.id].supervisors=[];
      if(!DB.perUser[u.id].custom) DB.perUser[u.id].custom={};
    }
  });
  // Existing installs (like yours) already have a `permissions` object saved from before
  // World Team existed — add the missing key to every role so it isn't invisible by default.
  Object.keys(DB.permissions).forEach(role=>{
    ['worldteam','getteam','milteam','presteam'].forEach(sec=>{
      if(!(sec in DB.permissions[role])) DB.permissions[role][sec] = (role==='superadmin'||role==='admin') ? 'write' : 'view';
    });
  });
  if(!DB.shared) DB.shared={transactions:[],members:[],gifts:[],coaches:[],supervisors:[],custom:{}};
  else {
    if(!DB.shared.coaches) DB.shared.coaches=[];
    if(!DB.shared.supervisors) DB.shared.supervisors=[];
    if(!DB.shared.custom) DB.shared.custom={};
  }
  if(!DB.customSections) DB.customSections=[];
  if(!DB.userPermissions) DB.userPermissions={};
  DB.customSections.forEach(cs=>{ if(!cs.fields || !cs.fields.length) cs.fields = DEFAULT_CUSTOM_FIELDS(); });
  // Make sure every custom section has a records array in every data scope, even ones
  // created after some users/perUser buckets already existed.
  DB.customSections.forEach(cs=>{
    if(!DB.shared.custom[cs.id]) DB.shared.custom[cs.id]=[];
    Object.values(DB.perUser||{}).forEach(u=>{ if(!u.custom[cs.id]) u.custom[cs.id]=[]; });
  });
  if(reconcileMemberSupervisors()) save(true);
  localStorage.setItem(STORE,JSON.stringify(DB)); 
}

// Keeps every member's stored Supervisor in sync with their Coach's current Supervisor.
// The member-form auto-fill only catches this the next time someone opens and saves that
// one record — this runs on every load/sync so ALL existing data self-corrects immediately,
// without anyone having to manually reopen and resave each member. Returns true if it changed
// anything, so the caller can push the fix to the cloud instead of leaving it purely local.
function reconcileMemberSupervisors(){
  let changed = false;
  const fix = (members, coaches, supervisors) => {
    (members||[]).forEach(m=>{
      if(!m.coachId) return;
      const coach = (coaches||[]).find(c=>c.id===m.coachId);
      if(coach){
        if(coach.supervisorId && m.supervisorId !== coach.supervisorId){
          m.supervisorId = coach.supervisorId;
          m.supervisorName = coach.supervisorName || (supervisors||[]).find(s=>s.id===coach.supervisorId)?.name || m.supervisorName;
          changed = true;
        }
        return;
      }
      // The coachId doesn't match anyone in Coaches anymore — most likely that person was
      // promoted straight from Coach to Supervisor (their id carries over into Supervisors).
      // In that case they're no longer this member's "coach", they ARE the supervisor now.
      const promoted = (supervisors||[]).find(s=>s.id===m.coachId);
      if(promoted && m.supervisorId !== promoted.id){
        m.supervisorId = promoted.id; m.supervisorName = promoted.name;
        m.coachId = ""; m.coachName = "";
        changed = true;
      }
    });
  };
  fix(DB.shared?.members, DB.shared?.coaches, DB.shared?.supervisors);
  Object.values(DB.perUser||{}).forEach(u=>fix(u.members, u.coaches, u.supervisors));
  return changed;
}

function startCloud(){
  if(!firebaseAvailable){ setSync("Local mode — no cloud sync",true); return; }
  onSnapshot(DOC, { includeMetadataChanges: true }, snap=>{
    setSync("✓ Data Synchronized");
    if(snap.exists() && snap.data().json){ 
      try { 
        const newJson = snap.data().json;
        if (newJson === lastCloudJson) return; 
        if (snap.metadata.hasPendingWrites) return; 
        if (isDirty) { cloudSave(true); return; }

        lastCloudJson = newJson;
        applyingRemote = true; 
        DB = {...DB,...JSON.parse(newJson)}; 
        ensure(); 
        localStorage.setItem(STORE,JSON.stringify(DB)); 
        applyingRemote = false; 
        if(currentUser) render(); 
      } catch(e) {} 
    }
    else { setSync("✓ Data Synchronized"); cloudSave(true); }
  }, e=>setSync("Sync error — check network",true));
}

// Mobile browsers (Android/iOS) frequently skip 'beforeunload' entirely, which used to
// mean a pending debounced write could be lost if the app was closed/backgrounded right
// after an edit. 'visibilitychange' + 'pagehide' fire reliably in that situation, so we
// flush any pending save through every one of these exit signals.
function flushPendingSave(){
  if(!firebaseAvailable) return;
  if(writeTimer || isDirty){
    clearTimeout(writeTimer); writeTimer = null;
    setDoc(DOC, {json:JSON.stringify(DB)}).then(()=>{ localStorage.setItem("mm_dirty","false"); isDirty=false; }).catch(()=>{});
  }
}
window.addEventListener('beforeunload', flushPendingSave);
window.addEventListener('pagehide', flushPendingSave);
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden') flushPendingSave(); });
// Safety-net autosave: if something was left dirty (e.g. app crashed/closed before a write
// completed), keep retrying every 10s so no edit is silently lost.
setInterval(() => { if(isDirty) flushPendingSave(); }, 10000);

window.checkDuplicatePhone = (val, prefix, excludeId) => {

  const digits = (val||"").replace(/[^0-9]/g,"");

  const d = data();
  const all = [...(d.members||[]).map(p=>({...p,_t:'member'})), ...(d.coaches||[]).map(p=>({...p,_t:'coach'})), ...(d.supervisors||[]).map(p=>({...p,_t:'supervisor'}))];

  else { warnEl.classList.add("hidden"); warnEl.textContent=""; }
};
function levenshtein(a, b){
  const m = a.length, n = b.length;
  if(m===0) return n; if(n===0) return m;
  let prev = Array.from({length:n+1}, (_,i)=>i);
  for(let i=1;i<=m;i++){
    const cur = [i];
    for(let j=1;j<=n;j++){
      cur[j] = a[i-1]===b[j-1] ? prev[j-1] : 1 + Math.min(prev[j-1], prev[j], cur[j-1]);
    }
    prev = cur;
  }
  return prev[n];
}
function timeAgo(ts){
  const diff = Math.floor((Date.now()-ts)/1000);
  if(diff<60) return "just now";
  if(diff<3600) return Math.floor(diff/60)+"m ago";
  if(diff<86400) return Math.floor(diff/3600)+"h ago";
  if(diff<604800) return Math.floor(diff/86400)+"d ago";
  return new Date(ts).toLocaleDateString();
}

/* THE DOWNLINE CONSTRAINT ENGINE */
// Walks the supervisor->supervisor chain (A supervises B, B supervises C, C supervises D...)
// and returns the root supervisor's id plus every supervisor beneath it, at any depth.
// Guards against accidental circular links (A under B under A) so it can never loop forever.
function getDownlineSupervisorIds(rootId, supervisors) {
    const ids = new Set([rootId]);
    let added = true;
    while (added) {
        added = false;
        supervisors.forEach(s => {
            if (s.supervisorId && ids.has(s.supervisorId) && !ids.has(s.id)) {
                ids.add(s.id);
                added = true;
            }
        });
    }
    return ids;
}
function getScopedMembers(d) {
    let members = d.members || [];
    if (isSuperAdmin() || isAdmin()) return members;
    if (currentUser.linkedId) {
        const downline = getDownlineSupervisorIds(currentUser.linkedId, d.supervisors || []);
        return members.filter(m => downline.has(m.supervisorId) || (m.coachId && downline.has((d.coaches||[]).find(c => c.id === m.coachId)?.supervisorId)));
    }
    return members; 
}
function getScopedCoaches(d) {
    let coaches = d.coaches || [];
    if (isSuperAdmin() || isAdmin()) return coaches;
    if (currentUser.linkedId) {
        const downline = getDownlineSupervisorIds(currentUser.linkedId, d.supervisors || []);
        return coaches.filter(c => downline.has(c.supervisorId));
    }
    return coaches;
}
function getScopedSupervisors(d) {
    let supervisors = d.supervisors || [];
    if (isSuperAdmin() || isAdmin()) return supervisors;
    if (currentUser.linkedId) {
        const downline = getDownlineSupervisorIds(currentUser.linkedId, supervisors);
        return supervisors.filter(s => downline.has(s.id));
    }
    return supervisors;
}
function getScopedActivity(d){
    let log = DB.activityLog || [];
    if (isSuperAdmin() || isAdmin()) return log;
    if (currentUser.linkedId) {
        const downline = getDownlineSupervisorIds(currentUser.linkedId, d.supervisors || []);
        // Only show entries tied to a member/coach/supervisor within this person's downline.
        // Marathon payments and gifts have no supervisor-hierarchy link in this data model,
        // so they're only visible to admins/superadmin in the activity feed.
        return log.filter(a => a.scopeId && downline.has(a.scopeId));
    }
    return [];
}

function suggestUsername(name){
    let base = (name||"user").toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,15) || "user";
    let candidate = base, n = 1;
    while(DB.users.some(u=>u.username.toLowerCase()===candidate.toLowerCase())){ candidate = base + (n++); }
    return candidate;
}

function finishRankChange(oldType, newType, id, loginInfo) {
    const d = DB.shared; 
    const sourceArr = oldType === 'member' ? d.members : (oldType === 'coach' ? d.coaches : d.supervisors);
    const destArr = newType === 'member' ? d.members : (newType === 'coach' ? d.coaches : d.supervisors);
    const idx = sourceArr.findIndex(x => x.id === id);
    if(idx < 0) return;
    
    const person = sourceArr.splice(idx, 1)[0];

    if (newType === 'supervisor') {
        const { uname, pin } = loginInfo;
        if(!DB.permissions['supervisor']) DB.permissions['supervisor'] = { dashboard:"view", marathon:"hidden", club:"write", coaches:"write", supervisors:"write", gifts:"hidden", backup:"hidden" };
        DB.users.push({ id: uname, username: uname, pin: pin, role: 'supervisor', linkedId: person.id });
        DB.profiles[uname] = {displayName: person.name, phone: person.phone||"", email: person.email||"", bio: "", theme: "light", dateFormat: "UK"};
        DB.perUser[uname] = {transactions:[],members:[],gifts:[],coaches:[],supervisors:[]};
        if (oldType === 'coach') {
            // This person was a Coach — their members shouldn't be left pointing at a coach
            // record that no longer exists. They're supervised directly by the promoted person now.
            d.members.forEach(m => { if(m.coachId === person.id) { m.coachId=""; m.coachName=""; m.supervisorId=person.id; m.supervisorName=person.name; } });
        }
        toast("Supervisor Login Created!");
    }

    if (oldType === 'supervisor') {
        const uIdx = DB.users.findIndex(u => u.linkedId === person.id);
        if(uIdx >= 0) {
            const uId = DB.users[uIdx].id; DB.users.splice(uIdx, 1); delete DB.profiles[uId]; delete DB.perUser[uId];
        }
        let saSup = d.supervisors.find(s => s.id === "sup_sa_root");
        if(!saSup) { saSup = { id: "sup_sa_root", name: "Super Admin (Root)", phone: "", email: "", status: "active" }; d.supervisors.push(saSup); }
        d.coaches.forEach(c => { if(c.supervisorId === person.id) { c.supervisorId = saSup.id; c.supervisorName = saSup.name; } });
        d.members.forEach(m => { if(m.supervisorId === person.id) { m.supervisorId = saSup.id; m.supervisorName = saSup.name; } });
        toast("Supervisor Login Destroyed. Downline rerouted.");
    }

    if (newType === 'member') {
        person.coachId = person.coachId || ""; person.coachName = person.coachName || "";
        person.supervisorId = person.supervisorId || ""; person.supervisorName = person.supervisorName || "";
        person.firstKit = person.firstKit || "pending"; person.secondKit = person.secondKit || "pending";
    } else if (newType === 'coach') {
        person.supervisorId = person.supervisorId || ""; person.supervisorName = person.supervisorName || "";
        person.status = "active";
    } else if (newType === 'supervisor') {
        person.status = "active";
    }

    destArr.push(person); save(true); closeModal(); render(); 
}

function buildNav(){

  const backupIdx = NAV.findIndex(n=>n.id==="backup");

  const sectionKeyMap = {Overview:"sec_overview", Operations:"sec_operations", Recognition:"sec_recognition", System:"sec_system", Account:"sec_account"};
  let lastSection = null;
  $("navList").innerHTML=fullNav.map(n=>{

    if(n.section !== lastSection){ sectionHtml = `<div class="nav-section-lbl">${esc(t(sectionKeyMap[n.section]||n.section))}</div>`; lastSection = n.section; }

  if(!name) return "?";
  const parts = name.trim().split(/\s+/);

const AVATAR_COLORS=["#146356","#B98A2E","#2A5C8A","#0F766E","#9C7326","#4B5C54"];
function avatarChip(name){
  let hash=0; for(let i=0;i<(name||"").length;i++) hash = name.charCodeAt(i) + ((hash<<5)-hash);
  const color = AVATAR_COLORS[Math.abs(hash)%AVATAR_COLORS.length];
  return `<div class="row-avatar" style="background:${color}">${esc(initials(name))}</div>`;
}

function renderDash(){
  const d=data();
  const scopedMembers = getScopedMembers(d);
  let alertItems = [];
  const now = new Date().getTime();

  if (canView('club')) {
    let firstKitDue = scopedMembers.filter(m => m.firstKit==='pending' && (now - new Date(m.joinDate || 0).getTime()) > 5 * 86400000);
    let secondKitDue = scopedMembers.filter(m => m.firstKit==='completed' && m.secondKit==='pending');
    firstKitDue = firstKitDue.filter(m => !dismissedAlertsArray.includes(m.id + "_k1"));
    secondKitDue = secondKitDue.filter(m => !dismissedAlertsArray.includes(m.id + "_k2"));

    firstKitDue.forEach(m => {
      const days = Math.floor((now - new Date(m.joinDate || 0).getTime()) / 86400000);
      alertItems.push(`<div class="alert-item" id="alert-${m.id}_k1"><span><i class="fas fa-exclamation-circle" style="margin-right:6px;color:#f59e0b"></i> <b>${esc(m.name)}</b>'s First Kit is pending (${days} days ago)</span> <div style="display:flex;gap:8px;align-items:center"><button class="btn btn-sm btn-amber" onclick="go('club')">Resolve</button><button class="btn btn-sm btn-whatsapp" onclick="openWhatsApp('${esc(m.phone||'')}', 'Hi')" title="WhatsApp Reminder"><i class="fab fa-whatsapp"></i></button><button class="alert-x-btn" onclick="dismissSingleAlert('${m.id}_k1')" title="Dismiss"><i class="fas fa-times"></i></button></div></div>`);
    });
    secondKitDue.forEach(m => {
      alertItems.push(`<div class="alert-item" id="alert-${m.id}_k2"><span><i class="fas fa-check-circle" style="margin-right:6px;color:#f59e0b"></i> <b>${esc(m.name)}</b> finished 1st Kit. 2nd Kit due!</span> <div style="display:flex;gap:8px;align-items:center"><button class="btn btn-sm btn-amber" onclick="go('club')">Resolve</button><button class="btn btn-sm btn-whatsapp" onclick="openWhatsApp('${esc(m.phone||'')}', 'Hi')" title="WhatsApp Reminder"><i class="fab fa-whatsapp"></i></button><button class="alert-x-btn" onclick="dismissSingleAlert('${m.id}_k2')" title="Dismiss"><i class="fas fa-times"></i></button></div></div>`);
    });
  }

  // Duplicate name detector — catches likely-same-person entries that a phone-number match
  // alone would miss: typos, spacing differences, reordered names ("Sheth Priya" vs "Priya
  // Sheth"), or a shared phone number even when the names look fairly different.
  // Note: this only ever compares within one list at a time (members-vs-members,
  // coaches-vs-coaches, supervisors-vs-supervisors) — the same person legitimately appearing
  // as both a Coach and a Supervisor record is never flagged, since those are different lists.
  const dupePairs = [];
  const scanForDupes = (list, type) => {
    const norm = n => (n||"").toLowerCase().replace(/[^a-z\s]/g,"").trim();
    const flat = n => norm(n).replace(/\s+/g,"");
    const wordsSorted = n => norm(n).split(/\s+/).filter(Boolean).sort().join("");
    const phoneDigits = p => (p||"").replace(/[^0-9]/g,"");
    for(let i=0;i<list.length;i++){
      for(let j=i+1;j<list.length;j++){
        const a=list[i], b=list[j];
        const na=flat(a.name), nb=flat(b.name);
        if(!na || !nb) continue;
        const pairKey = [a.id,b.id].sort().join("_");
        if(dismissedAlertsArray.includes("dupe_"+pairKey)) continue;
        const sameFlat = na===nb;
        const sameReordered = !sameFlat && wordsSorted(a.name)===wordsSorted(b.name) && wordsSorted(a.name).length>0;
        const closeTypo = !sameFlat && !sameReordered && Math.abs(na.length-nb.length)<=2 && levenshtein(na,nb) <= 2 && na.length>5;
        const pa=phoneDigits(a.phone), pb=phoneDigits(b.phone);
        const samePhone = !sameFlat && !sameReordered && pa && pb && pa===pb && pa.length>=7;
        if(sameFlat || sameReordered || closeTypo || samePhone){
          const reason = samePhone ? 'share the same phone number' : sameReordered ? 'look like the same name, just reordered' : 'look like the same person';
          dupePairs.push({type, a, b, pairKey, reason});
        }
      }
    }
  };
  if(canView('club')) scanForDupes(scopedMembers, 'members');
  if(canView('coaches')) scanForDupes(getScopedCoaches(d), 'coaches');
  if(canView('supervisors')) scanForDupes(getScopedSupervisors(d), 'supervisors');
  dupePairs.slice(0,5).forEach(({type,a,b,pairKey,reason}) => {
    alertItems.push(`<div class="alert-item" id="alert-dupe_${pairKey}"><span><i class="fas fa-clone" style="margin-right:6px;color:#f59e0b"></i> <b>${esc(a.name)}</b> and <b>${esc(b.name)}</b> ${reason}</span> <div style="display:flex;gap:8px;align-items:center"><button class="btn btn-sm btn-amber" onclick="mergeModal('${type}','${a.id}','${b.id}')">Review</button><button class="alert-x-btn" onclick="dismissSingleAlert('dupe_${pairKey}')" title="Dismiss"><i class="fas fa-times"></i></button></div></div>`);
  });

  // Backup reminder — nudges the person who'd actually run the export, not everyone.
  if (canWrite('backup') && !dismissedAlertsArray.includes('backup_reminder')) {
    const lastExport = +(localStorage.getItem("mm_last_export")||0);
    const daysSinceExport = lastExport ? Math.floor((now-lastExport)/86400000) : null;
    if (!lastExport || daysSinceExport >= 14) {
      alertItems.push(`<div class="alert-item" id="alert-backup_reminder"><span><i class="fas fa-cloud-arrow-down" style="margin-right:6px;color:#f59e0b"></i> ${lastExport?`It's been ${daysSinceExport} days since your last JSON backup`:"You haven't exported a JSON backup yet"} — worth doing one</span> <div style="display:flex;gap:8px;align-items:center"><button class="btn btn-sm btn-amber" onclick="go('backup')">Export Now</button><button class="alert-x-btn" onclick="dismissSingleAlert('backup_reminder')" title="Dismiss"><i class="fas fa-times"></i></button></div></div>`);
    }
  }

  let alertsHtml = "";
  if (alertItems.length > 0) {
    alertsHtml = `<div class="alert-box"><div class="alert-head"><i class="fas fa-bell"></i> Action Tracker</div>` + alertItems.join("") + `</div>`;
  }

  let statsHtml = '<div class="stats">';
  let hasStats = false;
  if (canView('marathon')) {
      const rec = d.transactions.filter(t=>t.status==="completed" && t.type!=="sent").reduce((s,t)=>s+ Number(t.amount || 0),0);
      const sent = d.transactions.filter(t=>t.status==="completed" && t.type==="sent").reduce((s,t)=>s+ Number(t.amount || 0),0);
      const totalRev = rec - sent;
      statsHtml += `<div class="stat"><div class="stat-ic ic-green"><i class="fas fa-wallet"></i></div><div class="stat-info"><div class="stat-val">${money(totalRev)}</div><div class="stat-lbl">Net Marathon Flow</div></div></div><div class="stat"><div class="stat-ic ic-blue"><i class="fas fa-running"></i></div><div class="stat-info"><div class="stat-val">${d.transactions.length}</div><div class="stat-lbl">Total Marathon Logs</div></div></div>`;
      hasStats = true;
  }
  if (canView('club')) {
      statsHtml += `<div class="stat"><div class="stat-ic ic-purple"><i class="fas fa-users"></i></div><div class="stat-info"><div class="stat-val">${scopedMembers.length}</div><div class="stat-lbl">Active Club Members</div></div></div>`;
      hasStats = true;
  }
  if (canView('gifts')) {
      statsHtml += `<div class="stat"><div class="stat-ic ic-red"><i class="fas fa-gift"></i></div><div class="stat-info"><div class="stat-val">${d.gifts.length}</div><div class="stat-lbl">Rewards Distributed</div></div></div>`;
      hasStats = true;
  }
  statsHtml += '</div>';
  if (!hasStats) statsHtml = `<div class="empty" style="grid-column: 1 / -1"><i class="fas fa-shield-alt"></i>You don't have permission to view dashboard metrics.</div>`;

  const displayName = DB.profiles[currentUser.id]?.displayName||currentUser.username;
  const hour = new Date().getHours();
  const greeting = hour<12?"Good morning":hour<18?"Good afternoon":"Good evening";
  const todayStr = new Date().toLocaleDateString('en-US',{weekday:'long', month:'long', day:'numeric'});
  const p = DB.profiles[currentUser.id]||{};
  const lastSync = +(localStorage.getItem("mm_last_sync")||0);
  const syncDotColor = lastSync ? "#4ADE80" : "#9A9AA5";
  const syncLabel = lastSync ? "Synced " + timeAgo(lastSync) : "Not synced yet";
  const heroHtml = `<div class="dash-hero">
    <div class="dash-hero-row">
      <div><div class="dash-hero-greeting">${greeting}, ${esc(displayName)}</div><div class="dash-hero-date">${todayStr}</div></div>
    </div>
    <div class="dash-hero-toolbar">
      <div class="dash-hero-search">
        <i class="fas fa-search"></i>
        <input id="globalSearchInput" placeholder="${t('findAnyone')}..." value="${esc(globalSearchQuery)}" oninput="setGlobalSearch(this.value)">
      </div>
      ${(canWrite('club')||canWrite('coaches')||canWrite('supervisors')) ? `<button class="dash-quick-toggle" onclick="openQuickAddMenu()" title="Quick Add"><i class="fas fa-plus"></i></button>` : ''}
      <button class="dash-quick-toggle" onclick="quickToggleDark()" title="Toggle dark mode"><i class="fas ${p.theme==='dark'?'fa-sun':'fa-moon'}"></i></button>
    </div>
    <div id="globalSearchResults"></div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px">
      <div class="dash-hero-badge"><i class="fas fa-layer-group"></i> ${currentUser.role.toUpperCase()}</div>
      <div class="dash-sync-status" id="dashSyncStatus"><i class="fas fa-circle" style="font-size:.5rem;color:${syncDotColor}"></i> <span id="dashSyncText">${syncLabel}</span></div>
    </div>
  </div>`;

  // Weekly digest — computed only from data we can actually verify (join dates, transaction
  // dates/types, activity log timestamps). No estimated or invented figures.
  const weekAgo = Date.now() - 7*86400000;
  const newMembersWeek = scopedMembers.filter(m => m.joinDate && new Date(m.joinDate).getTime() >= weekAgo).length;
  const revenueWeek = (canView('marathon') ? d.transactions : []).filter(tx => tx.date && new Date(tx.date).getTime() >= weekAgo && tx.type !== 'sent').reduce((sum,tx)=>sum+(+tx.amount||0),0);
  const activityWeek = getScopedActivity(d).filter(a => a.ts >= weekAgo).length;
  const digestHtml = `<div class="card">
    <div class="card-head"><span class="card-title"><i class="fas fa-calendar-week" style="color:var(--primary);margin-right:8px"></i>This Week</span></div>
    <div class="stats" style="margin-bottom:0">
      <div class="stat"><div class="stat-ic ic-green"><i class="fas fa-user-plus"></i></div><div class="stat-info"><div class="stat-val">${newMembersWeek}</div><div class="stat-lbl">New Members</div></div></div>
      ${canView('marathon')?`<div class="stat"><div class="stat-ic ic-blue"><i class="fas fa-indian-rupee-sign"></i></div><div class="stat-info"><div class="stat-val">${money(revenueWeek)}</div><div class="stat-lbl">Collected</div></div></div>`:''}
      <div class="stat"><div class="stat-ic ic-purple"><i class="fas fa-bolt"></i></div><div class="stat-info"><div class="stat-val">${activityWeek}</div><div class="stat-lbl">Actions Logged</div></div></div>
    </div>
  </div>`;

  const recentActs = getScopedActivity(d).slice(0, 8);
  const actionVerb = {added:'added', updated:'updated', deleted:'removed'};

  // Contact completeness — informational only, not an alert. Neutral styling on purpose.
  const contactPeople = [
    ...(canView('club')?scopedMembers:[]),
    ...(canView('coaches')?getScopedCoaches(d):[]),
    ...(canView('supervisors')?getScopedSupervisors(d):[])
  ];
  const hasPhone = p => p.phone && p.phone.trim() !== '' && p.phone.trim() !== '-';
  const contactPct = contactPeople.length ? Math.round(contactPeople.filter(hasPhone).length / contactPeople.length * 100) : null;
  const contactHtml = contactPct===null ? '' : `<div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap">
      <div>
        <div style="font-weight:700;font-size:.9rem;color:var(--text)">Contact Info Coverage</div>
        <div style="font-size:.76rem;color:var(--text-muted);margin-top:2px">${contactPeople.length - contactPeople.filter(hasPhone).length} of ${contactPeople.length} people are missing a phone number</div>
      </div>
      <div style="font-family:var(--font-mono);font-weight:700;font-size:1.2rem;color:var(--primary)">${contactPct}%</div>
    </div>
    <div style="height:6px;background:var(--border);border-radius:99px;margin-top:12px;overflow:hidden"><div style="height:100%;width:${contactPct}%;background:var(--primary);border-radius:99px"></div></div>
  </div>`;

  const activityHtml = `<div class="card">
    <div class="card-head"><span class="card-title"><i class="fas fa-clock-rotate-left" style="color:var(--primary);margin-right:8px"></i>${t('recentActivity')}</span></div>
    ${recentActs.length ? `<div style="display:flex;flex-direction:column;gap:2px">` + recentActs.map(a=>`
      <div style="display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--border)">
        <div style="width:32px;height:32px;border-radius:8px;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--primary)"><i class="fas ${a.icon}" style="font-size:.8rem"></i></div>
        <div style="flex:1;min-width:0;font-size:.85rem"><b>${esc(a.user||'Someone')}</b> ${actionVerb[a.action]||a.action} ${a.label.toLowerCase()} <b>${esc(dispName(a.name))}</b></div>
        <div style="font-size:.72rem;color:var(--text-muted);white-space:nowrap;flex-shrink:0">${timeAgo(a.ts)}</div>
      </div>`).join("") + `</div>`
      : `<div class="empty" style="padding:24px"><i class="fas fa-clock-rotate-left"></i>No activity recorded yet</div>`}
  </div>`;

  $("pageBody").innerHTML = heroHtml + alertsHtml + digestHtml + contactHtml + activityHtml + switcher() + statsHtml;
  renderGlobalSearchResults();
}

    amount:+$("f_amt").value||0, status, notes:$("f_notes").value.trim(), 
    date: date||new Date().toISOString(), completedDate: status==='completed'?new Date().toISOString():null,

window.autoSelectSup = (cId) => {
    const supSelect = $('m_sup'); if(!supSelect) return;

        // A Supervisor was picked directly as this member's coach — their own record is

function renderClubResults(){
  const d=data();
  let rows=[...getScopedMembers(d)].sort((a,b)=>new Date(b.joinDate || 0).getTime()-new Date(a.joinDate || 0).getTime());

  if(clubSearch) rows=rows.filter(m=>(m.name||"").toLowerCase().includes(clubSearch));
  if(clubFilterCoach) rows=rows.filter(m=>m.coachId===clubFilterCoach);
  if(clubFilterSupervisor){
    const downline = getDownlineSupervisorIds(clubFilterSupervisor, d.supervisors||[]);
    rows=rows.filter(m=>downline.has(m.supervisorId) || (m.coachId && downline.has((d.coaches||[]).find(c=>c.id===m.coachId)?.supervisorId)));
  }

  if(clubSubTab === 'kit1') rows = rows.filter(m => m.firstKit !== 'completed');
  if(clubSubTab === 'kit2') rows = rows.filter(m => m.firstKit === 'completed' && m.secondKit !== 'completed');

  const k1=rows.filter(m=>m.firstKit==="completed").length, k2=rows.filter(m=>m.secondKit==="completed").length;
  const coaches = d.coaches || []; const supervisors = d.supervisors || [];
  const resultsEl=$("club_results"); if(!resultsEl) return;
  const statsEl=$("club_stats");

  if(clubSubTab === 'summary'){
    // Clean directory view: just name + coach + supervisor, nothing else.
    resultsEl.innerHTML = rows.length ?
      `<table><thead><tr><th>Member Name</th><th>Coach</th><th>Supervisor</th></tr></thead><tbody>`+
      rows.map(m=>{
        const cName = m.coachId ? (coaches.find(x=>x.id===m.coachId)?.name || m.coachName) : m.coachName;
        const sName = m.supervisorId ? (supervisors.find(x=>x.id===m.supervisorId)?.name || m.supervisorName) : m.supervisorName;
        return `<tr>
          <td data-label="Member Name"><div style="display:flex;gap:10px;align-items:center">${avatarChip(m.name)}<div style="font-weight:700;color:var(--text)">${esc(dispName(m.name))}</div></div></td>
          <td data-label="${t('coach')}">${esc(dispName(cName)||"-")}${m.coachIsSupervisor?' <span class="badge bg-purple" style="font-size:.6rem;vertical-align:middle">Supervisor</span>':''}</td>
          <td data-label="${t('supervisor')}">${esc(dispName(sName)||"-")}</td>
        </tr>`;
      }).join("")+`</tbody></table>` : `<div class="empty"><i class="fas fa-address-card"></i>No members found in this view</div>`;
    if(statsEl) statsEl.innerHTML = "";
    return;
  }

  resultsEl.innerHTML = rows.length?
        `<table><thead><tr><th>${t('name')}</th><th>${t('contact')}</th><th>${t('coach')}</th><th>${t('supervisor')}</th><th>${t('payment')}</th><th>${t('joinDate')}</th><th>Address</th><th>Formula 1</th><th>Afresh</th><th>${t('kitsProgress')}</th>${canWrite('club')?`<th>${t('actions')}</th>`:''}</tr></thead><tbody>`+
        rows.map(m=>{
          const cName = m.coachId ? (coaches.find(x=>x.id===m.coachId)?.name || m.coachName) : m.coachName;
          const sName = m.supervisorId ? (supervisors.find(x=>x.id===m.supervisorId)?.name || m.supervisorName) : m.supervisorName;
          return `<tr>
          <td data-label="${t('name')}"><div style="display:flex;gap:10px;align-items:flex-start">${avatarChip(m.name)}<div><div style="font-weight:700;color:var(--text)">${esc(dispName(m.name))}</div>${m.lastEditedBy ? `<div style="font-size:.7rem;color:var(--text-muted);font-weight:500;margin-top:4px;letter-spacing:0"><i class="fas fa-user-edit" style="font-size:.65rem;margin-right:3px"></i> ${esc(m.lastEditedBy)}</div>` : ''}</div></div></td>
          <td data-label="${t('contact')}">
             <div style="display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end">
               <span style="white-space:nowrap">${esc(m.phone||"-")}</span> 
               ${m.phone && m.phone.trim()!=="-" ?`<a href="tel:${esc(m.phone)}" class="btn btn-sm btn-blue" style="padding:4px 8px;border-radius:6px;min-width:28px" title="Call"><i class="fas fa-phone"></i></a>`:''}
               ${m.phone && m.phone.trim()!=="-" ?`<button class="btn btn-sm btn-whatsapp" style="padding:4px 8px;border-radius:6px;min-width:28px" onclick="openWhatsApp('${esc(m.phone)}', 'Hi')" title="Chat on WhatsApp"><i class="fab fa-whatsapp"></i></button>`:''}
               ${m.email && m.email.trim()!=="-" ?`<a href="mailto:${esc(m.email)}" class="btn btn-sm btn-amber" style="padding:4px 8px;border-radius:6px;min-width:28px" title="Email"><i class="fas fa-envelope"></i></a>`:''}
             </div>
          </td>
          <td data-label="${t('coach')}">${esc(dispName(cName)||"-")}${m.coachIsSupervisor?' <span class="badge bg-purple" style="font-size:.6rem;vertical-align:middle">Supervisor</span>':''}</td>
          <td data-label="${t('supervisor')}">${esc(dispName(sName)||"-")}</td>

          <td data-label="Afresh">${m.afreshFlavor?`<span class="badge bg-gray">${esc(m.afreshFlavor)}</span>`:'-'}</td>
          <td data-label="${t('kitsProgress')}"><div style="display:flex;gap:4px;flex-direction:column"><span class="badge ${m.firstKit==='completed'?'bg-green':'bg-amber'}">${t('kit1')}: ${m.firstKit==='completed'?t('completed'):t('pending')}</span><span class="badge ${m.secondKit==='completed'?'bg-green':'bg-amber'}">${t('kit2')}: ${m.secondKit==='completed'?t('completed'):t('pending')}</span></div></td>
          ${canWrite('club')?`<td data-label="${t('actions')}">
             ${isSuperAdmin() ? `<button class="btn btn-sm btn-purple" onclick="rankModal('member', '${m.id}')" title="Change Rank"><i class="fas fa-exchange-alt"></i></button>` : ''}
             <button class="btn btn-sm btn-gray" onclick="exportPersonCard('members','${m.id}')" title="Export Card"><i class="fas fa-id-card"></i></button>
             <button class="btn btn-sm btn-gray" onclick='memberModal(${sj(m)})'><i class="fas fa-pen"></i></button> <button class="btn btn-sm btn-red" onclick="delItem('members','${m.id}')"><i class="fas fa-trash"></i></button></td>`:''}
        </tr>`}).join("")+`</tbody></table>` : `<div class="empty"><i class="fas fa-users"></i>No members found in this view</div>`;

  if(!statsEl) return;
  statsEl.innerHTML = `<div class="card"><div class="card-head"><span class="card-title">Tracking Progress Overview</span></div>${
      rows.length? `<div class="stats" style="margin-bottom:0"><div class="stat"><div class="stat-ic ic-teal"><i class="fas fa-box"></i></div><div class="stat-info"><div class="stat-val">${k1}/${rows.length}</div><div class="stat-lbl">Kit 1 Completed</div></div></div><div class="stat"><div class="stat-ic ic-purple"><i class="fas fa-boxes-stacked"></i></div><div class="stat-info"><div class="stat-val">${k2}/${rows.length}</div><div class="stat-lbl">Kit 2 Completed</div></div></div></div>`
      : `<div class="empty" style="padding:20px"><i class="fas fa-box"></i>No kit data available</div>`}</div>`;
}
function flavorOptions(kind, selected){
  const list = DB.settings[kind] || [];
  return `<option value="">-- None --</option>` + list.map(f=>`<option value="${esc(f)}"${selected===f?' selected':''}>${esc(f)}</option>`).join("");

window.addFlavor = (kind, selectId) => {
  const name = prompt("New flavor name:");
  if(!name || !name.trim()) return;
  const clean = name.trim();
  DB.settings[kind] = DB.settings[kind] || [];
  if(DB.settings[kind].some(f=>f.toLowerCase()===clean.toLowerCase())){ toast("That flavor already exists"); return; }
  DB.settings[kind].push(clean);
  save(true);
  const sel = $(selectId);
  if(sel){ sel.innerHTML = flavorOptions(kind, clean); }
  toast("Flavor added");
};
window.manageFlavors = (kind, label) => {

window.addFlavorThenReopen = (kind, label) => {
  const name = prompt("New flavor name:");
  if(name && name.trim()){
    const clean = name.trim();
    DB.settings[kind] = DB.settings[kind] || [];
    if(DB.settings[kind].some(f=>f.toLowerCase()===clean.toLowerCase())){ toast("That flavor already exists"); }
    else { DB.settings[kind].push(clean); save(true); toast("Flavor added"); }
  }
  manageFlavors(kind, label);
};
window.deleteFlavor = (kind, label, name) => {
  if(!confirm(`Remove "${name}" from the ${label} flavor list? Members already assigned this flavor keep it — it just won't be selectable for new entries.`)) return;
  DB.settings[kind] = (DB.settings[kind]||[]).filter(f=>f!==name);
  save(true);
  manageFlavors(kind, label);
};

window.saveMember=(id,joinDate)=>{

window.autoFillSupLogin = () => {
  const name = $("s_name").value.trim();
  $("s_user").value = suggestUsername(name);
  $("s_pin").value = suggestPin();
};
window.saveSup=id=>{
  const name=$("s_name").value.trim(); if(!name) return toast("Supervisor Name required");
  const supId=$("s_sup").value;
  const finalId = id || nid();
  if(id && supId){
    // A supervisor can't be placed under someone who is already in their own downline chain —
    // that would create a loop (e.g. D ends up supervising A who supervises ... who supervises D).
    const downline = getDownlineSupervisorIds(id, data().supervisors||[]);
    if(downline.has(supId)) return toast("Can't do that — this would create a circular supervisor chain");
  }

  // Manual login ID / PIN handling — works for brand-new supervisors and for editing an
  // existing one's login the same way, instead of only through the rank-promotion flow.
  const uname = $("s_user").value.trim(), pin = $("s_pin").value.trim();
  const existingIdx = DB.users.findIndex(u => u.linkedId === finalId);
  if (uname) {
    const dupe = DB.users.find((u,i) => i !== existingIdx && u.username.toLowerCase() === uname.toLowerCase());
    if (dupe) return toast("That Login ID is already taken by another account");
    if (pin && pin.length < 4) return toast("PIN must be at least 4 digits");
    if (existingIdx >= 0) {
      const oldId = DB.users[existingIdx].id;
      if (oldId !== uname) {
        // Renaming the login ID — carry the profile/personal data over to the new key so
        // nothing gets lost, and keep the active session in sync if this is the logged-in user.
        DB.profiles[uname] = DB.profiles[oldId] || { displayName: name, theme: "light", dateFormat: "UK" };
        delete DB.profiles[oldId];
        DB.perUser[uname] = DB.perUser[oldId] || { transactions: [], members: [], gifts: [], coaches: [], supervisors: [] };
        delete DB.perUser[oldId];
        if (currentUser && currentUser.id === oldId) currentUser.id = uname;
        if (viewingAs === oldId) viewingAs = uname;
        if (sessionStorage.getItem("mm_session") === oldId) sessionStorage.setItem("mm_session", uname);
        if (localStorage.getItem("mm_remembered_session") === oldId) localStorage.setItem("mm_remembered_session", uname);
      }
      DB.users[existingIdx].id = uname;
      DB.users[existingIdx].username = uname;
      if (pin) DB.users[existingIdx].pin = pin;
    } else {
      if (!pin || pin.length < 4) return toast("Set a PIN (min 4 digits) to create this login");
      if (!DB.permissions['supervisor']) DB.permissions['supervisor'] = { dashboard:"view", marathon:"hidden", club:"write", coaches:"write", supervisors:"write", gifts:"hidden", backup:"hidden" };
      DB.users.push({ id: uname, username: uname, pin, role: 'supervisor', linkedId: finalId });
      DB.profiles[uname] = { displayName: name, phone: $("s_phone").value.trim(), email: $("s_email").value.trim(), bio: "", theme: "light", dateFormat: "UK" };
      DB.perUser[uname] = { transactions: [], members: [], gifts: [], coaches: [], supervisors: [] };
    }
  } else if (existingIdx >= 0) {
    const uId = DB.users[existingIdx].id;
    DB.users.splice(existingIdx, 1);
    delete DB.profiles[uId]; delete DB.perUser[uId];
  }

  commitItem('supervisors', {
    id: finalId, name, phone:$("s_phone").value.trim(), email:$("s_email").value.trim(),
    supervisorId: supId, supervisorName: supId ? data().supervisors.find(x=>x.id===supId)?.name : "",
    herbalifeRank: $("s_rank").value,
    status:$("s_stat").value, ownerId: viewingAs||currentUser.id, lastEditedBy: getEditor()
  }, id ? "Supervisor updated" : "Supervisor added");
};

window.exportPersonCard = (type, id) => {
  const d = data();
  const person = (d[type]||[]).find(x=>x.id===id);
  if(!person) return;

  // Card content is member-facing / shareable — internal business figures (payments) are
  // deliberately left off. Kit status uses colored pills instead of plain text for clarity.
  let rows = [];
  if(type==='members'){
    rows = [
      ['Coach', (person.coachName||'-') + (person.coachIsSupervisor && person.coachName ? ' (also Supervisor)' : ''), null],
      ['Supervisor', person.supervisorName||'-', null],
      ['Join Date', fmtDate(person.joinDate), null],
      ['1st Kit', person.firstKit==='completed'?'Completed':'Pending', person.firstKit==='completed'],
      ['2nd Kit', person.secondKit==='completed'?'Completed':'Pending', person.secondKit==='completed']
    ];
    if(person.address) rows.push(['Address', person.address, null]);
    // Formula 1 / Afresh flavor selections are intentionally left off the exported card.
  } else if(type==='coaches'){
    rows = [['Supervisor', person.supervisorName||'-', null],['Phone', person.phone||'-', null],['Email', person.email||'-', null],['Status', (person.status||'-').toUpperCase(), person.status==='active']];
  } else {
    rows = [['Upline Supervisor', person.supervisorName||'-', null],['Phone', person.phone||'-', null],['Email', person.email||'-', null],['Status', (person.status||'-').toUpperCase(), person.status==='active']];
  }

  const W = 900, HEADER = 160, NAME_H = 90, ROW_H = 68, FOOTER = 50, PAD = 44;
  const H = HEADER + NAME_H + rows.length*ROW_H + FOOTER;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  const roundRect = (x,y,w,h,r) => { ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); };

  // Outer card with rounded corners + soft shadow
  ctx.save();
  ctx.shadowColor = 'rgba(20,99,86,.18)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 12;
  ctx.fillStyle = '#FFFFFF'; roundRect(0,0,W,H,22); ctx.fill();
  ctx.restore();
  roundRect(0,0,W,H,22); ctx.save(); ctx.clip();

  // Header with subtle gradient + decorative circles
  const grad = ctx.createLinearGradient(0,0,W,HEADER);
  grad.addColorStop(0,'#146356'); grad.addColorStop(1,'#0E4A40');
  ctx.fillStyle = grad; ctx.fillRect(0,0,W,HEADER);
  ctx.save();
  ctx.globalAlpha = 0.08; ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(W-40, -20, 130, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(60, HEADER+30, 70, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  ctx.fillStyle = '#fff'; ctx.font = '700 30px Arial'; ctx.fillText('MoneyMatrix', PAD, 62);
  ctx.font = '400 14px Arial'; ctx.fillStyle = 'rgba(255,255,255,.82)';
  const typeLabel = type==='members' ? 'Club Membership Card' : type==='coaches' ? 'Club Coach Record' : 'Supervisor Record';
  ctx.fillText(typeLabel, PAD, 90);
  ctx.font = '600 11px Arial'; ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.fillText(new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}).toUpperCase(), PAD, 118);

  // Avatar circle with initials, overlapping header/body boundary
  const avR = 52, avX = W-PAD-avR, avY = HEADER;
  ctx.save(); ctx.shadowColor='rgba(0,0,0,.25)'; ctx.shadowBlur=14; ctx.shadowOffsetY=4;
  ctx.fillStyle = '#B98A2E'; ctx.beginPath(); ctx.arc(avX, avY, avR, 0, Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(avX, avY, avR, 0, Math.PI*2); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = '700 34px Arial'; ctx.textAlign = 'center';
  ctx.fillText(initials(person.name), avX, avY+12); ctx.textAlign = 'left';

  // Name
  ctx.fillStyle = '#101014'; ctx.font = '700 36px Arial'; ctx.fillText(person.name||'-', PAD, HEADER+NAME_H-16);

  // Rows — plain text, or a colored status pill when isGood is not null
  let y = HEADER + NAME_H + 14;
  rows.forEach(([label,val,isGood])=>{
    ctx.fillStyle = '#9CA3AF'; ctx.font = '700 12px Arial'; ctx.fillText(label.toUpperCase(), PAD, y);
    if(isGood===null){
      ctx.fillStyle = '#101014'; ctx.font = '600 21px Arial';
      let displayVal = String(val);
      const maxW = W - PAD*2;
      if(ctx.measureText(displayVal).width > maxW){
        while(displayVal.length>1 && ctx.measureText(displayVal+'…').width > maxW) displayVal = displayVal.slice(0,-1);
        displayVal += '…';
      }
      ctx.fillText(displayVal, PAD, y+28);
    } else {
      const pillColor = isGood ? '#146356' : '#B98A2E';
      const pillBg = isGood ? '#E4F3EC' : '#FBF3E4';
      ctx.font = '700 15px Arial';
      const pw = ctx.measureText(val).width + 32;
      ctx.fillStyle = pillBg; roundRect(PAD, y+8, pw, 30, 15); ctx.fill();
      ctx.fillStyle = pillColor; ctx.fillText(val, PAD+16, y+28);
    }
    ctx.strokeStyle = '#EEF0F3'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(PAD,y+ROW_H-22); ctx.lineTo(W-PAD,y+ROW_H-22); ctx.stroke();
    y += ROW_H;
  });

  ctx.fillStyle = '#B5BAC4'; ctx.font = '400 12px Arial'; ctx.fillText('Generated by MoneyMatrix — ' + new Date().toLocaleDateString(), PAD, H-20);
  ctx.restore(); // release clip

  canvas.toBlob(blob=>{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = (person.name||'contact').replace(/[^a-z0-9]+/gi,'_').toLowerCase() + '_card.png';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  });
};

  <p style="font-size:.85rem;color:var(--text-muted);margin-bottom:16px;line-height:1.4">Pick the duplicate record to remove and the record to keep. Every member, coach, or supervisor linked to the duplicate is automatically re-pointed to the record you keep before it's deleted — nothing gets orphaned.</p>
  <div class="form-group"><label>Keep This Record</label><select id="merge_keep"><option value="">-- Select --</option>${opts(preKeep)}</select></div>
  <div class="form-group"><label>Merge & Delete This Record</label><select id="merge_dupe"><option value="">-- Select --</option>${opts(preDupe)}</select></div>
  <div class="modal-btns"><button class="btn btn-gray" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="confirmMerge('${type}')"><i class="fas fa-object-ungroup"></i> Merge</button></div>`);

window.confirmMerge = (type) => {
  const keepId = $("merge_keep").value, dupeId = $("merge_dupe").value;
  if(!keepId || !dupeId) return toast("Select both records");
  if(keepId === dupeId) return toast("Choose two different records");
  const d = data();
  const keep = d[type].find(x=>x.id===keepId), dupe = d[type].find(x=>x.id===dupeId);
  if(!keep || !dupe) return toast("Record not found");
  if(!confirm(`Merge "${dupe.name}" into "${keep.name}"? This can't be undone.`)) return;
  takeSnapshot(`Before Merge (${type})`);

  // Fill in any blank fields on the kept record using the duplicate's data.
  ["phone","email","notes","supervisorId","supervisorName","coachId","coachName","paymentReceiver"].forEach(f=>{
    if(!keep[f] && dupe[f]) keep[f] = dupe[f];
  });

  if(type === "coaches"){
    (d.members||[]).forEach(m=>{ if(m.coachId===dupeId){ m.coachId=keepId; m.coachName=keep.name; } });
  } else if(type === "supervisors"){
    (d.coaches||[]).forEach(c=>{ if(c.supervisorId===dupeId){ c.supervisorId=keepId; c.supervisorName=keep.name; } });
    (d.members||[]).forEach(m=>{ if(m.supervisorId===dupeId){ m.supervisorId=keepId; m.supervisorName=keep.name; } });
    (d.supervisors||[]).forEach(s=>{ if(s.supervisorId===dupeId){ s.supervisorId=keepId; s.supervisorName=keep.name; } });
    (DB.users||[]).forEach(u=>{ if(u.linkedId===dupeId) u.linkedId=keepId; });
  }
  d[type] = d[type].filter(x=>x.id!==dupeId);
  save(true); closeModal(); render();
  toast(`Merged "${dupe.name}" into "${keep.name}"`);
};

window.performDelete=(coll,id)=>{
  closeModal();

  const item=d[coll][idx];
  const meta = ACTIVITY_LABELS[coll];
  const name = meta ? item[meta.nameKey] : "Item";
  if(meta) logActivity('deleted', coll, name, scopeIdFor(coll,item));
  d[coll].splice(idx,1);
  save(true); render();
  showUndoToast(`${meta?meta.label:'Item'} "${name}" deleted.`, ()=>{

function dl(content,name,type){ const b=new Blob([content],{type}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=name; a.click(); }
let pendingImportData = null;
window.importJSON=e=>{
  const f=e.target.files[0]; if(!f)return; const r=new FileReader();
  r.onload=()=>{ try{
    const raw = r.result.trim();
    if(raw.startsWith("<")){ toast("That doesn't look like a JSON backup file — please pick the exported MoneyMatrix .json file, not this one."); return; }
    const j=JSON.parse(raw);
    if(typeof j !== 'object' || j===null || (!j.sharedData && !j.shared && !j.members && !j.transactions)){
      toast("This file doesn't look like a MoneyMatrix backup. Please select a file exported from System Backup."); return;
    }
    pendingImportData = j.sharedData||j.shared||j;
    showModal(`
      <div class="modal-head"><h3>Import Backup Data</h3><button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button></div>
      <p style="font-size:.85rem;color:var(--text-muted);margin-bottom:18px;line-height:1.5">This backup contains transactions, members, gifts, coaches, and supervisors. How should it be applied to your current data?</p>
      <button class="btn btn-gray" style="width:100%;margin-bottom:10px;text-align:left;padding:14px;display:block;white-space:normal;line-height:1.4" onclick="applyImport('merge')"><b><i class="fas fa-plus"></i> Merge (safe)</b><div style="font-size:.75rem;font-weight:500;margin-top:4px;color:var(--text-muted);white-space:normal">Only adds records that don't already exist. Never touches anything you already have.</div></button>
      <button class="btn btn-red" style="width:100%;margin-bottom:14px;text-align:left;padding:14px;display:block;white-space:normal;line-height:1.4" onclick="applyImport('override')"><b><i class="fas fa-rotate"></i> Override (replace matching records)</b><div style="font-size:.75rem;font-weight:500;margin-top:4px;color:#fff;white-space:normal">Any record whose ID matches gets fully replaced with the backup's version — e.g. kit status, payments, and notes will all update to match this file. New records are also added.</div></button>
      <div class="modal-btns"><button class="btn btn-gray" onclick="closeModal()">Cancel</button></div>
    `);
  }catch(err){ toast("Import failed — this file doesn't appear to be valid JSON. Please select the file exported from System Backup."); } };
  r.readAsText(f);
};
window.applyImport = (mode) => {
  const sd = pendingImportData; if(!sd) return;
  if(mode==='override' && !confirm("This will overwrite any existing record whose ID matches the backup — including kit progress, payments, and notes. Continue?")) return;
  takeSnapshot(`Before JSON Import (${mode})`);
  const d=data();
  ["transactions","members","gifts","coaches","supervisors"].forEach(c=>{ 
    if(!d[c]) d[c] = [];
    (sd[c]||[]).forEach(item=>{
      const id=item.id||nid();
      const i = d[c].findIndex(x=>x.id===id);
      if(i>=0){ if(mode==='override') d[c][i] = {...item, id}; }
      else d[c].push({...item,id});
    }); 
  });
  if(sd.custom){
    d.custom = d.custom || {};
    Object.keys(sd.custom).forEach(sectionId=>{
      d.custom[sectionId] = d.custom[sectionId] || [];
      (sd.custom[sectionId]||[]).forEach(item=>{
        const id=item.id||nid();
        const i = d.custom[sectionId].findIndex(x=>x.id===id);
        if(i>=0){ if(mode==='override') d.custom[sectionId][i] = {...item, id}; }
        else d.custom[sectionId].push({...item,id});
      });
    });
  }
  pendingImportData = null;
  save(true); closeModal(); render(); toast(mode==='override' ? "Data Overridden Successfully" : "Data Import Successful");
};

/* ===== Excel/CSV Client Import ===== */
let excelImportRows=[];
function pickField(row, keys){
  const map={}; Object.keys(row).forEach(k=>map[k.toLowerCase().trim()]=row[k]);
  for(const k of keys){ if(map[k]!==undefined && map[k]!=="") return map[k]; }
  return "";
}
window.importExcel=e=>{
  const f=e.target.files[0]; if(!f) return;
  if(typeof XLSX==="undefined"){ toast("Excel library failed to load — check your connection"); e.target.value=""; return; }
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const wb=XLSX.read(ev.target.result,{type:"array"});
      const sheet=wb.Sheets[wb.SheetNames[0]];
      const json=XLSX.utils.sheet_to_json(sheet,{defval:""});
      if(!json.length){ toast("No rows found in that file"); return; }
      const d=data();
      excelImportRows=json.map(row=>{
        const name=String(pickField(row,["name","member name","customer name","client name","full name"])).trim();
        const phone=String(pickField(row,["phone","mobile","contact","phone number","mobile number"])).trim();
        const email=String(pickField(row,["email","email address"])).trim();
        const coachName=String(pickField(row,["coach","coach name"])).trim();
        const supervisorName=String(pickField(row,["supervisor","supervisor name"])).trim();
        const paymentToCoach=+pickField(row,["payment","paymenttocoach","payment to coach","amount"])||0;
        const paymentReceiver=String(pickField(row,["receiver","payment receiver","paymentreceiver"])).trim();
        const firstKit=/complet/i.test(String(pickField(row,["kit1","first kit","firstkit"])))?"completed":"pending";
        const secondKit=/complet/i.test(String(pickField(row,["kit2","second kit","secondkit"])))?"completed":"pending";
        const notes=String(pickField(row,["notes","note","remarks"])).trim();
        const joinRaw=pickField(row,["joindate","join date","date"]);
        let joinDate=new Date().toISOString();
        if(joinRaw){ const parsed=new Date(joinRaw); if(!isNaN(parsed)) joinDate=parsed.toISOString(); }
        const match=(d.members||[]).find(m=>(phone && m.phone && m.phone.trim()===phone) || (name && m.name && m.name.toLowerCase().trim()===name.toLowerCase()));
        const coach=(d.coaches||[]).find(c=>c.name && coachName && c.name.toLowerCase()===coachName.toLowerCase());
        const supervisor=(d.supervisors||[]).find(s=>s.name && supervisorName && s.name.toLowerCase()===supervisorName.toLowerCase());
        return {name,phone,email,coachName,coachId:coach?coach.id:"",supervisorName,supervisorId:supervisor?supervisor.id:"",paymentToCoach,paymentReceiver,firstKit,secondKit,notes,joinDate,match,action:match?"ask":"new"};
      }).filter(r=>r.name);
      if(!excelImportRows.length){ toast("No rows had a recognizable Name column"); return; }
      showExcelImportModal();
    }catch(err){ toast("Could not read file: "+err.message); }
  };
  reader.readAsArrayBuffer(f);
  e.target.value="";
};
function showExcelImportModal(){
  const conflicts=excelImportRows.filter(r=>r.match);
  const fresh=excelImportRows.filter(r=>!r.match);
  showModal(`
    <div class="modal-head"><h3>Import Client Data</h3><button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button></div>
    <p style="font-size:.85rem;color:var(--text-muted);margin-bottom:14px">${excelImportRows.length} row(s) found — <b>${fresh.length}</b> new, <b>${conflicts.length}</b> matching an existing member by name/phone.</p>
    ${conflicts.length?`
    <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">
      <button class="btn btn-sm btn-blue" onclick="setAllExcelActions('override')">Override All Matches</button>
      <button class="btn btn-sm btn-primary" onclick="setAllExcelActions('new')">Add All As New</button>
      <button class="btn btn-sm btn-gray" onclick="setAllExcelActions('skip')">Skip All Matches</button>
    </div>
    <div style="max-height:280px;overflow-y:auto;border:1px solid var(--border);border-radius:10px;padding:4px 10px;margin-bottom:14px">
    ${conflicts.map(r=>{ const gi=excelImportRows.indexOf(r); return `
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid #f1f5f9">
        <div><b>${esc(r.name)}</b><br><small style="color:var(--text-muted)">${esc(r.phone||"no phone")} — matches existing "${esc(r.match.name)}"</small></div>
        <select onchange="setExcelAction(${gi},this.value)" style="font-size:.8rem;padding:5px 8px;flex-shrink:0">
          <option value="skip"${r.action==='skip'?' selected':''}>Skip</option>
          <option value="override"${r.action==='override'?' selected':''}>Override existing</option>
          <option value="new"${r.action==='new'?' selected':''}>Add as new customer</option>
        </select>
      </div>`; }).join("")}
    </div>`:''}
    <div class="modal-btns"><button class="btn btn-gray" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="confirmExcelImport()"><i class="fas fa-check"></i> Import ${excelImportRows.length} Row(s)</button></div>
  `);
}
window.setExcelAction=(idx,val)=>{ excelImportRows[idx].action=val; };
window.setAllExcelActions=val=>{ excelImportRows.forEach(r=>{ if(r.match) r.action=val; }); showExcelImportModal(); };
window.confirmExcelImport=()=>{
  takeSnapshot("Before Excel Import");
  const d=data();
  let added=0, overridden=0, skipped=0;
  excelImportRows.forEach(r=>{
    if(r.match && r.action==="skip"){ skipped++; return; }
    const base={name:r.name,phone:r.phone,email:r.email,coachId:r.coachId,coachName:r.coachName,supervisorId:r.supervisorId,supervisorName:r.supervisorName,paymentToCoach:r.paymentToCoach,paymentReceiver:r.paymentReceiver,firstKit:r.firstKit,secondKit:r.secondKit,notes:r.notes,joinDate:r.joinDate,ownerId:viewingAs||currentUser.id,lastEditedBy:getEditor()};
    if(r.match && r.action==="override"){
      const i=d.members.findIndex(m=>m.id===r.match.id);
      if(i>=0){ d.members[i]={...r.match,...base,id:r.match.id}; overridden++; }
    } else {
      d.members.push({...base,id:nid()});
      added++;
    }
  });
  save(true); excelImportRows=[]; closeModal(); render();
  toast(`Import complete: ${added} added, ${overridden} overridden, ${skipped} skipped`);
};

// PIN reset — Superadmin-only, no separate OTP/SMS step. This is a static offline-capable
// app with no backend server, so real SMS-based OTP verification isn't something that can be
// wired up here (it needs a paid SMS gateway and a server to issue/verify codes). The security
// gate that already exists is: only someone already logged in AS Superadmin can reach this
// button at all, which is the same trust model most small/family-run tools use for account
// recovery. If real phone-based OTP is something you need later, that would require setting up
// Firebase Phone Authentication in your Firebase project first — a bigger, separate project.

  const u = DB.users.find(x=>x.id===userId); if(!u) return;

    <div class="modal-head"><h3><i class="fas fa-key" style="color:var(--gold)"></i> PIN Reset</h3><button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button></div>
