<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#10b981" />
<title>MoneyMatrix - Enterprise Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="manifest" href='data:application/manifest+json,{"name":"MoneyMatrix","short_name":"MoneyMatrix","start_url":".","display":"standalone","background_color":"%23f3f6f8","theme_color":"%2310b981","icons":[{"src":"data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 192 192%27%3E%3Crect width=%27192%27 height=%27192%27 rx=%2740%27 fill=%27%2310b981%27/%3E%3Ctext x=%2796%27 y=%27132%27 font-size=%27110%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27Arial%27 font-weight=%27bold%27%3E%E2%82%B9%3C/text%3E%3C/svg%3E","sizes":"192x192","type":"image/svg+xml"}]}' />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='40' fill='%2310b981'/%3E%3Ctext x='96' y='132' font-size='110' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3E%E2%82%B9%3C/text%3E%3C/svg%3E" />

<!-- ANTI-FLICKER ENGINE -->
<script>
  if (sessionStorage.getItem("mm_session") || localStorage.getItem("mm_remembered_session")) {
    document.documentElement.classList.add("authed");
  }
</script>

<style>
  :root { 
    --primary: #10b981; 
    --primary-hover: #059669; 
    --primary-gradient: linear-gradient(135deg, #10b981, #059669);
    --bg: #f3f6f8; 
    --surface: #ffffff; 
    --text: #0f172a; 
    --text-muted: #64748b; 
    --border: #e2e8f0; 
    --card-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.04);
    --hover-shadow: 0 12px 30px -4px rgba(16, 185, 129, 0.12);
  }
  
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html, body { overflow-x: hidden; }
  body{font-family:'Inter', sans-serif;background:var(--bg);color:var(--text);letter-spacing:-0.01em;min-height:100vh}
  .hidden{display:none!important}
  button, a {font-family:inherit;cursor:pointer;border:none;outline:none;text-decoration:none}
  input,select,textarea{font-family:inherit;font-size:15px;outline:none;transition:all .2s ease;color:var(--text)}
  input:focus,select:focus,textarea:focus{border-color:var(--primary)!important;box-shadow:0 0 0 3px rgba(16,185,129,.15)}

  /* Anti-Flicker Pre-paint Display Rules */
  html.authed #loginPage { display: none !important; }
  html.authed #appShell { display: block !important; }

  /* Custom Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

  /* Sidebar */
  .sidebar{width:250px;background:#0b1121;min-height:100vh;height:100vh;position:fixed;left:0;top:0;color:#fff;padding:20px 0;transition:transform .3s cubic-bezier(0.4, 0, 0.2, 1);z-index:100;box-shadow:4px 0 15px rgba(0,0,0,.08);overflow-y:auto;padding-bottom:80px}
  .sidebar::-webkit-scrollbar { width: 4px; }
  .sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); }
  
  .sidebar-brand{padding:0 24px 24px;border-bottom:1px solid rgba(255,255,255,0.05);margin-bottom:12px}
  .sidebar-brand h1{font-size:1.35rem;font-weight:800;color:var(--primary);letter-spacing:-.5px;display:flex;align-items:center;gap:8px}
  .sidebar-brand p{font-size:.7rem;color:#94a3b8;margin-top:4px;text-transform:uppercase;letter-spacing:1px;font-weight:600}
  .nav-item{padding:12px 20px;cursor:pointer;transition:all .2s ease;display:flex;align-items:center;gap:12px;border-left:3px solid transparent;font-size:.9rem;color:#94a3b8;font-weight:500}
  .nav-item:hover{background:rgba(255,255,255,0.03);color:#fff}
  .nav-item.active{background:rgba(16,185,129,0.1);border-left-color:var(--primary);color:var(--primary);font-weight:700}
  .nav-item i{width:20px;text-align:center;font-size:1.1rem}
  .nav-divider{border-top:1px solid rgba(255,255,255,0.05);margin:10px 0}

  /* Main Area */
  .main{margin-left:250px;padding:24px;min-height:100vh;max-width:1400px;margin-right:auto;overflow-x:hidden}
  
  /* Topbar */
  .topbar{background:rgba(255,255,255,0.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:14px 24px;border-radius:16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;box-shadow:0 2px 10px rgba(0,0,0,.03);position:sticky;top:16px;z-index:90;border:1px solid rgba(255,255,255,0.6)}
  .topbar-header { display: flex; align-items: center; gap: 12px; }
  .topbar h2{font-size:1.25rem;font-weight:800;letter-spacing:-0.5px}
  .topbar-right{display:flex;align-items:center;gap:10px;font-size:.85rem;flex-wrap:wrap}
  .menu-btn { display: none; background: transparent; color: var(--text); font-size: 1.3rem; padding: 4px; border-radius: 6px; cursor: pointer; transition: 0.2s; }
  .menu-btn:hover { color: var(--primary); }

  /* Badges & Pills */
  .pill{padding:5px 12px;border-radius:999px;font-size:.7rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
  .pill-blue{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
  .pill-purple{background:#faf5ff;color:#7e22ce;border:1px solid #e9d5ff}

  /* Switcher */
  .switcher{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;align-items:center;background:var(--surface);padding:8px 16px;border-radius:12px;box-shadow:var(--card-shadow)}
  .switcher .lbl{font-size:.75rem;color:var(--text-muted);margin-right:6px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
  .chip{padding:6px 16px;border-radius:999px;font-size:.8rem;border:1px solid var(--border);background:var(--bg);transition:all .2s ease;font-weight:600;color:var(--text)}
  .chip:hover{border-color:var(--primary);color:var(--primary);background:var(--surface)}
  .chip.active{background:var(--primary-gradient);color:#fff;border-color:transparent;box-shadow:0 3px 8px rgba(16,185,129,.25)}

  /* Cards */
  .card{background:var(--surface);border-radius:16px;padding:24px;box-shadow:var(--card-shadow);margin-bottom:24px;border:1px solid rgba(255,255,255,0.8);transition:transform .2s ease, box-shadow .2s ease}
  .card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid #f1f5f9}
  .card-title{font-size:1.1rem;font-weight:800;color:var(--text);display:flex;align-items:center;gap:8px}

  /* Stats Grid */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:24px}
  .stat{background:var(--surface);border-radius:16px;padding:18px;box-shadow:var(--card-shadow);border:1px solid rgba(255,255,255,0.8);display:flex;align-items:center;gap:14px;transition:all .2s ease}
  .stat:hover{transform:translateY(-3px);box-shadow:var(--hover-shadow)}
  .stat-ic{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.5)}
  .ic-green{background:linear-gradient(135deg, #d1fae5, #a7f3d0);color:#059669}
  .ic-blue{background:linear-gradient(135deg, #dbeafe, #bfdbfe);color:#2563eb}
  .ic-amber{background:linear-gradient(135deg, #fef3c7, #fde68a);color:#d97706}
  .ic-red{background:linear-gradient(135deg, #fee2e2, #fecaca);color:#dc2626}
  .ic-purple{background:linear-gradient(135deg, #f3e8ff, #e9d5ff);color:#7e22ce}
  .ic-teal{background:linear-gradient(135deg, #ccfbf1, #99f6e4);color:#0f766e}
  .stat-info{flex:1}
  .stat-val{font-size:1.4rem;font-weight:800;line-height:1.2;color:var(--text);letter-spacing:-0.5px}
  .stat-lbl{font-size:.8rem;color:var(--text-muted);font-weight:600;margin-top:2px}

  /* Buttons */
  .btn{padding:10px 16px;border-radius:8px;font-size:.85rem;font-weight:600;transition:all .2s ease;display:inline-flex;align-items:center;justify-content:center;gap:6px;letter-spacing:.2px;white-space:nowrap}
  .btn:active{transform:scale(0.97)}
  .btn-primary{background:var(--primary-gradient);color:#fff;box-shadow:0 3px 10px rgba(16,185,129,.2)}
  .btn-primary:hover{box-shadow:0 5px 12px rgba(16,185,129,.3);transform:translateY(-1px)}
  .btn-blue{background:linear-gradient(135deg, #3b82f6, #2563eb);color:#fff;box-shadow:0 3px 10px rgba(59,130,246,.2)}
  .btn-blue:hover{box-shadow:0 5px 12px rgba(59,130,246,.3);transform:translateY(-1px)}
  .btn-amber{background:linear-gradient(135deg, #f59e0b, #d97706);color:#fff;box-shadow:0 3px 10px rgba(245,158,11,.2)}
  .btn-amber:hover{box-shadow:0 5px 12px rgba(245,158,11,.3);transform:translateY(-1px)}
  .btn-whatsapp{background:linear-gradient(135deg, #25D366, #128C7E);color:#fff;box-shadow:0 3px 10px rgba(37,211,102,.2)}
  .btn-whatsapp:hover{box-shadow:0 5px 12px rgba(37,211,102,.3);transform:translateY(-1px)}
  .btn-red{background:linear-gradient(135deg, #ef4444, #dc2626);color:#fff;box-shadow:0 3px 10px rgba(239,68,68,.2)}
  .btn-red:hover{box-shadow:0 5px 12px rgba(239,68,68,.3);transform:translateY(-1px)}
  .btn-gray{background:#f1f5f9;color:#475569;border:1px solid #e2e8f0}
  .btn-gray:hover{background:#e2e8f0;color:#0f172a}
  .btn-purple{background:linear-gradient(135deg, #a855f7, #7e22ce);color:#fff;box-shadow:0 3px 10px rgba(168,85,247,.2)}
  .btn-purple:hover{box-shadow:0 5px 12px rgba(168,85,247,.3);transform:translateY(-1px)}
  .btn-sm{padding:6px 12px;font-size:.75rem;border-radius:6px}

  /* Inputs & Filters */
  .search{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;margin-bottom:12px;background:#fff;box-shadow:inset 0 1px 3px rgba(0,0,0,.02)}
  .filter-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;background:#f8fafc;padding:10px;border-radius:12px;border:1px solid var(--border)}
  .filter-row .search{margin-bottom:0;flex:1;background:var(--surface);border:1px solid #cbd5e1}
  .filter-row select{padding:10px 14px;border:1px solid var(--border);border-radius:8px;background:#fff;min-width:140px;font-weight:500;box-shadow:inset 0 1px 3px rgba(0,0,0,.02)}

  /* Tables */
  table{width:100%;border-collapse:separate;border-spacing:0}
  th,td{padding:12px 10px;text-align:left;font-size:.85rem}
  th{background:#f8fafc;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.5px;font-size:.7rem;border-bottom:2px solid var(--border)}
  th:first-child{border-top-left-radius:10px} th:last-child{border-top-right-radius:10px}
  td{border-bottom:1px solid #f1f5f9;color:#334155;vertical-align:middle}
  tr{transition:background .2s}
  tr:hover td{background:#f8fafc}
  .tbl-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--border)}
  
  .badge{padding:4px 10px;border-radius:6px;font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;display:inline-flex;align-items:center;justify-content:center}
  .bg-green{background:#ecfdf5;color:#059669;border:1px solid #a7f3d0}
  .bg-amber{background:#fffbeb;color:#d97706;border:1px solid #fde68a}
  .bg-gray{background:#f1f5f9;color:#475569;border:1px solid #cbd5e1}
  .bg-red{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}

  .empty{text-align:center;padding:50px 20px;color:var(--text-muted)}
  .empty i{font-size:3rem;margin-bottom:12px;opacity:.3;background:-webkit-linear-gradient(#94a3b8, #cbd5e1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}

  /* Action Center Alert */
  .alert-box{background:linear-gradient(to right, #fffbeb, #ffffff);border-left:4px solid #f59e0b;padding:16px;border-radius:10px 14px 14px 10px;margin-bottom:20px;box-shadow:var(--card-shadow);position:relative;border:1px solid #fef3c7;animation:slideDown 0.4s ease}
  @keyframes slideDown { from {opacity:0; transform:translateY(-10px)} to {opacity:1; transform:translateY(0)} }
  .alert-head{display:flex;align-items:center;gap:10px;font-weight:800;color:#92400e;margin-bottom:10px;font-size:1rem;text-transform:uppercase;letter-spacing:.5px}
  .alert-item{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:#fff;border-radius:10px;margin-bottom:8px;border:1px solid #fde68a;font-size:.85rem;color:#92400e;font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.03);flex-wrap:wrap;gap:10px;transition:all 0.3s ease}
  .alert-item:last-child{margin-bottom:0}
  .alert-x-btn { background: transparent; color: #9ca3af; border: none; width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; font-size: 1rem; }
  .alert-x-btn:hover { background: #fee2e2; color: #ef4444; }

  /* Login Screen */
  .login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at top left, #1e293b, #020617);padding:20px;position:relative;overflow:hidden}
  .login::before{content:'';position:absolute;width:600px;height:600px;background:var(--primary);filter:blur(150px);opacity:0.15;border-radius:50%;top:-200px;left:-200px}
  .login-card{background:rgba(255,255,255,0.95);backdrop-filter:blur(20px);border-radius:20px;padding:35px;width:100%;max-width:440px;box-shadow:0 20px 40px -10px rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.2);position:relative;z-index:1}
  .login-logo{text-align:center;margin-bottom:30px}
  .login-logo h1{font-size:2.2rem;background:var(--primary-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:800;letter-spacing:-1px}
  .login-logo p{color:var(--text-muted);font-size:.9rem;margin-top:6px;font-weight:500}
  
  .login-btn{width:100%;padding:14px;background:var(--primary-gradient);color:#fff;border-radius:12px;font-size:1.05rem;font-weight:800;letter-spacing:.5px;box-shadow:0 6px 15px rgba(16,185,129,.3);transition:.2s}
  .login-btn:hover{box-shadow:0 8px 20px rgba(16,185,129,.4);transform:translateY(-2px)}

  /* Form Elements & Modals (Restored Smooth Version) */
  .form-group{margin-bottom:16px}
  .form-group label{display:block;margin-bottom:6px;font-size:.8rem;font-weight:700;color:#334155;text-transform:uppercase;letter-spacing:.5px}
  .form-group input,.form-group select,.form-group textarea{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:8px;background:#f8fafc;font-weight:500}
  .form-group textarea{min-height:80px;resize:vertical}
  
  .modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.7);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;animation:fadeIn .2s ease;overflow-y:auto}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .modal{background:var(--surface);border-radius:20px;padding:26px;width:100%;max-width:500px;box-shadow:0 20px 40px rgba(0,0,0,.25);animation:slideUp .2s ease;margin:auto}
  @keyframes slideUp{from{transform:translateY(15px);opacity:0}to{transform:translateY(0);opacity:1}}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;border-bottom:1px solid #f1f5f9;padding-bottom:14px}
  .modal-head h3{font-size:1.25rem;font-weight:800;color:var(--text)}
  .modal-close{background:#f1f5f9;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:#64748b;transition:.2s}
  .modal-close:hover{background:#e2e8f0;color:#0f172a;transform:rotate(90deg)}
  .modal-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}

  /* Admin & Permissions */
  .profile-banner{display:flex;align-items:center;gap:20px;padding:25px;background:var(--primary-gradient);border-radius:16px;color:#fff;margin-bottom:24px;box-shadow:0 8px 20px rgba(16,185,129,.2);position:relative;overflow:hidden}
  .profile-banner::after{content:'';position:absolute;top:0;right:0;width:150px;height:150px;background:radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 70%);border-radius:50%;transform:translate(50%, -50%)}
  .profile-av{width:64px;height:64px;border-radius:50%;background:#fff;color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:800;box-shadow:0 6px 12px rgba(0,0,0,.1)}
  
  .set-row{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid #f1f5f9;gap:12px}
  .set-row:last-of-type{border-bottom:none}
  .set-row .desc{font-size:.75rem;color:var(--text-muted);margin-top:4px;line-height:1.4}
  
  .toggle{position:relative;display:inline-block;width:48px;height:26px;flex-shrink:0}
  .toggle input{opacity:0;width:0;height:0}
  .slider{position:absolute;inset:0;background:#cbd5e1;transition:.3s;border-radius:26px;cursor:pointer}
  .slider:before{content:"";position:absolute;height:18px;width:18px;left:4px;bottom:4px;background:#fff;transition:.3s cubic-bezier(0.4, 0, 0.2, 1);border-radius:50%;box-shadow:0 2px 4px rgba(0,0,0,.2)}
  .toggle input:checked+.slider{background:var(--primary)}
  .toggle input:checked+.slider:before{transform:translateX(22px)}

  /* Custom Segments */
  .perm-grid{display:flex;flex-direction:column;gap:12px;margin-top:8px}
  .perm-row{display:flex;justify-content:space-between;align-items:center;padding:16px;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 2px 4px rgba(0,0,0,.02);transition:.2s;flex-wrap:wrap;gap:12px}
  .perm-row:hover{border-color:#cbd5e1;box-shadow:0 4px 10px rgba(0,0,0,.04)}
  .seg-toggle { display:inline-flex; background:#f1f5f9; border-radius:10px; padding:4px; gap:4px; align-items:center; flex-wrap:wrap; border:1px solid #e2e8f0}
  .seg-btn { border:none; background:transparent; padding:8px 14px; border-radius:8px; cursor:pointer; font-size:.8rem; font-weight:700; color:#64748b; transition:all .2s ease; display:flex; align-items:center; gap:6px; white-space:nowrap; }
  .seg-btn:hover { color:#0f172a }
  .seg-btn.active { background:#fff; color:var(--primary); box-shadow:0 2px 6px rgba(0,0,0,.06); }

  /* Misc */
  #syncBar{position:fixed;top:0;left:250px;right:0;text-align:center;font-size:11px;font-weight:700;padding:6px;background:var(--primary-gradient);color:#fff;z-index:90;letter-spacing:.5px;box-shadow:0 2px 8px rgba(16,185,129,.3);transition:background 0.3s ease}
  .toast{position:fixed;bottom:20px;right:20px;background:#0f172a;color:#fff;padding:14px 20px;border-radius:10px;box-shadow:0 10px 25px rgba(0,0,0,.2);z-index:2000;font-weight:600;display:flex;align-items:center;gap:10px;border:1px solid #1e293b;animation:slideUp .3s ease; font-size:.9rem}
  .mobile-toggle{display:none;position:fixed;top:16px;left:16px;z-index:101;background:#0f172a;color:#fff;padding:12px 14px;border-radius:10px;box-shadow:0 4px 10px rgba(0,0,0,.15)}

  /* Mobile Responsive Master Overhaul */
  @media(max-width:900px){
    .sidebar{transform:translateX(-100%); width:250px}
    .sidebar.open{transform:translateX(0)}
    .main{margin-left:0; padding:16px; padding-top:16px;}
    
    .topbar {
      flex-direction: column; 
      align-items: flex-start; 
      gap: 14px;
      padding: 16px;
      margin-bottom: 20px;
      position: relative;
      top: 0;
      border-radius: 16px;
    }
    .topbar-header { display: flex; align-items: center; gap: 14px; width: 100%; }
    .topbar h2 { font-size: 1.2rem; }
    .topbar-right { width: 100%; justify-content: flex-start; }
    .menu-btn { display: inline-flex; align-items: center; justify-content: center; }
    #syncBar { left:0; }
    
    .stats { grid-template-columns: 1fr 1fr; gap: 12px; }
    
    table, thead, tbody, th, td, tr { display: block; width: 100%; }
    thead tr { display: none; }
    tr { margin-bottom: 16px; background: #fff; border-radius: 16px; border: 1px solid var(--border); padding: 16px; box-shadow:0 2px 8px rgba(0,0,0,.03); }
    td { text-align: right; padding: 10px 0 10px 40%; position: relative; border-bottom: 1px solid #f1f5f9; min-height:40px; display:flex; justify-content:flex-end; align-items:center; flex-wrap:wrap; gap:8px; width: 100% !important; }
    td:last-child { border-bottom: 0; padding-bottom: 0; }

function cloudSave(immediate = false){ 
  if(!firebaseAvailable){ localStorage.setItem("mm_dirty","false"); isDirty=false; setSync("Local mode — no cloud sync",true); return; }
  if(applyingRemote) return; 
  clearTimeout(writeTimer); 
  const jsonStr = JSON.stringify(DB);
  lastCloudJson = jsonStr; 
  const payload = { json: jsonStr }; 
  const pushToCloud = () => {
    setDoc(DOC, payload).then(() => {
        localStorage.setItem("mm_dirty", "false");
        isDirty = false;
    }).catch(e=>setSync("Save error",true));
  };
  if(immediate) pushToCloud();
  else writeTimer = setTimeout(pushToCloud, 400); 
}

// Keeps every member's stored Supervisor in sync with their Coach's current Supervisor.
// The member-form auto-fill only catches this the next time someone opens and saves that
// one record — this runs on every load/sync so ALL existing data self-corrects immediately,
// without anyone having to manually reopen and resave each member. Returns true if it changed
// anything, so the caller can push the fix to the cloud instead of leaving it purely local.
function reconcileMemberSupervisors(){
  let changed = false;
  const fix = (members, coaches) => {
    (members||[]).forEach(m=>{
      if(!m.coachId) return;
      const coach = (coaches||[]).find(c=>c.id===m.coachId);
      if(coach && coach.supervisorId && m.supervisorId !== coach.supervisorId){
        m.supervisorId = coach.supervisorId;
        m.supervisorName = coach.supervisorName || (DB.shared.supervisors||[]).find(s=>s.id===coach.supervisorId)?.name || m.supervisorName;
        changed = true;
      }
    });
  };
  fix(DB.shared?.members, DB.shared?.coaches);
  Object.values(DB.perUser||{}).forEach(u=>fix(u.members, u.coaches));
  return changed;
}

function startCloud(){
  if(!firebaseAvailable){ setSync("Local mode — no cloud sync",true); return; }
  onSnapshot(DOC, { includeMetadataChanges: true }, snap=>{
    setSync("✓ Data Synchronized");
    if(snap.exists() && snap.data().json){ 
      try { 
        const newJson = snap.data().json;
        if (newJson === lastCloudJson) return; 
        if (snap.metadata.hasPendingWrites) return; 
        if (isDirty) { cloudSave(true); return; }

        lastCloudJson = newJson;
        applyingRemote = true; 
        DB = {...DB,...JSON.parse(newJson)}; 
        ensure(); 
        localStorage.setItem(STORE,JSON.stringify(DB)); 
        applyingRemote = false; 
        if(currentUser) render(); 
      } catch(e) {} 
    }
    else { setSync("✓ Data Synchronized"); cloudSave(true); }
  }, e=>setSync("Sync error — check network",true));
}

// Mobile browsers (Android/iOS) frequently skip 'beforeunload' entirely, which used to
// mean a pending debounced write could be lost if the app was closed/backgrounded right
// after an edit. 'visibilitychange' + 'pagehide' fire reliably in that situation, so we
// flush any pending save through every one of these exit signals.
function flushPendingSave(){
  if(!firebaseAvailable) return;
  if(writeTimer || isDirty){
    clearTimeout(writeTimer); writeTimer = null;
    setDoc(DOC, {json:JSON.stringify(DB)}).then(()=>{ localStorage.setItem("mm_dirty","false"); isDirty=false; }).catch(()=>{});
  }
}

// completed), keep retrying every 10s so no edit is silently lost.
setInterval(() => { if(isDirty) flushPendingSave(); }, 10000);

/* THE DOWNLINE CONSTRAINT ENGINE */
// Walks the supervisor->supervisor chain (A supervises B, B supervises C, C supervises D...)
// and returns the root supervisor's id plus every supervisor beneath it, at any depth.
// Guards against accidental circular links (A under B under A) so it can never loop forever.
function getDownlineSupervisorIds(rootId, supervisors) {
    const ids = new Set([rootId]);
    let added = true;
    while (added) {
        added = false;
        supervisors.forEach(s => {
            if (s.supervisorId && ids.has(s.supervisorId) && !ids.has(s.id)) {
                ids.add(s.id);
                added = true;
            }
        });
    }
    return ids;
}
function getScopedMembers(d) {
    let members = d.members || [];
    if (isSuperAdmin() || isAdmin()) return members;
    if (currentUser.linkedId) {
        const downline = getDownlineSupervisorIds(currentUser.linkedId, d.supervisors || []);
        return members.filter(m => downline.has(m.supervisorId) || (m.coachId && downline.has((d.coaches||[]).find(c => c.id === m.coachId)?.supervisorId)));
    }
    return members; 
}
function getScopedCoaches(d) {
    let coaches = d.coaches || [];
    if (isSuperAdmin() || isAdmin()) return coaches;
    if (currentUser.linkedId) {
        const downline = getDownlineSupervisorIds(currentUser.linkedId, d.supervisors || []);
        return coaches.filter(c => downline.has(c.supervisorId));
    }
    return coaches;
}
function getScopedSupervisors(d) {
    let supervisors = d.supervisors || [];
    if (isSuperAdmin() || isAdmin()) return supervisors;
    if (currentUser.linkedId) {
        const downline = getDownlineSupervisorIds(currentUser.linkedId, supervisors);
        return supervisors.filter(s => downline.has(s.id));
    }
    return supervisors;
}

    let candidate = base, n = 1;
    while(DB.users.some(u=>u.username.toLowerCase()===candidate.toLowerCase())){ candidate = base + (n++); }
    return candidate;
}

function finishRankChange(oldType, newType, id, loginInfo) {
    const d = DB.shared; 
    const sourceArr = oldType === 'member' ? d.members : (oldType === 'coach' ? d.coaches : d.supervisors);
    const destArr = newType === 'member' ? d.members : (newType === 'coach' ? d.coaches : d.supervisors);
    const idx = sourceArr.findIndex(x => x.id === id);
    if(idx < 0) return;
    
    const person = sourceArr.splice(idx, 1)[0];

    if (newType === 'supervisor') {
        const { uname, pin } = loginInfo;
        if(!DB.permissions['supervisor']) DB.permissions['supervisor'] = { dashboard:"view", marathon:"hidden", club:"write", coaches:"write", supervisors:"write", gifts:"hidden", backup:"hidden" };
        DB.users.push({ id: uname, username: uname, pin: pin, role: 'supervisor', linkedId: person.id });
        DB.profiles[uname] = {displayName: person.name, phone: person.phone||"", email: person.email||"", bio: "", theme: "light", dateFormat: "UK"};
        DB.perUser[uname] = {transactions:[],members:[],gifts:[],coaches:[],supervisors:[]};
        toast("Supervisor Login Created!");
    }

    if (oldType === 'supervisor') {
        const uIdx = DB.users.findIndex(u => u.linkedId === person.id);
        if(uIdx >= 0) {
            const uId = DB.users[uIdx].id; DB.users.splice(uIdx, 1); delete DB.profiles[uId]; delete DB.perUser[uId];
        }
        let saSup = d.supervisors.find(s => s.id === "sup_sa_root");
        if(!saSup) { saSup = { id: "sup_sa_root", name: "Super Admin (Root)", phone: "", email: "", status: "active" }; d.supervisors.push(saSup); }
        d.coaches.forEach(c => { if(c.supervisorId === person.id) { c.supervisorId = saSup.id; c.supervisorName = saSup.name; } });
        d.members.forEach(m => { if(m.supervisorId === person.id) { m.supervisorId = saSup.id; m.supervisorName = saSup.name; } });
        toast("Supervisor Login Destroyed. Downline rerouted.");
    }

    if (newType === 'member') {
        person.coachId = person.coachId || ""; person.coachName = person.coachName || "";
        person.supervisorId = person.supervisorId || ""; person.supervisorName = person.supervisorName || "";
        person.firstKit = person.firstKit || "pending"; person.secondKit = person.secondKit || "pending";
    } else if (newType === 'coach') {
        person.supervisorId = person.supervisorId || ""; person.supervisorName = person.supervisorName || "";
        person.status = "active";
    } else if (newType === 'supervisor') {
        person.status = "active";
    }

    destArr.push(person); save(true); closeModal(); render(); 
}

        const days = Math.floor((now - new Date(m.joinDate || 0).getTime()) / 86400000);
        const msg = `Hi ${m.name}, this is a gentle reminder that your 1st Kit is due. Let us know when you're ready!`;
        alertsHtml += `<div class="alert-item" id="alert-${m.id}_k1"><span><i class="fas fa-exclamation-circle" style="margin-right:6px;color:#f59e0b"></i> <b>${esc(m.name)}</b>'s First Kit is pending (${days} days ago)</span> <div style="display:flex;gap:8px;align-items:center"><button class="btn btn-sm btn-amber" onclick="go('club')">Resolve</button><button class="btn btn-sm btn-whatsapp" onclick="openWhatsApp('${esc(m.phone||'')}', '${msg}')" title="WhatsApp Reminder"><i class="fab fa-whatsapp"></i></button><button class="alert-x-btn" onclick="dismissSingleAlert('${m.id}_k1')" title="Dismiss"><i class="fas fa-times"></i></button></div></div>`;
      });
      secondKitDue.forEach(m => {
        const msg = `Hi ${m.name}, great job completing your 1st Kit! This is a reminder for your 2nd Kit. Keep up the momentum!`;
        alertsHtml += `<div class="alert-item" id="alert-${m.id}_k2"><span><i class="fas fa-check-circle" style="margin-right:6px;color:#f59e0b"></i> <b>${esc(m.name)}</b> finished 1st Kit. 2nd Kit due!</span> <div style="display:flex;gap:8px;align-items:center"><button class="btn btn-sm btn-amber" onclick="go('club')">Resolve</button><button class="btn btn-sm btn-whatsapp" onclick="openWhatsApp('${esc(m.phone||'')}', '${msg}')" title="WhatsApp Reminder"><i class="fab fa-whatsapp"></i></button><button class="alert-x-btn" onclick="dismissSingleAlert('${m.id}_k2')" title="Dismiss"><i class="fas fa-times"></i></button></div></div>`;
      });
      alertsHtml += `</div>`;
    }
  }

  let statsHtml = '<div class="stats">';
  let hasStats = false;
  if (canView('marathon')) {
      const rec = d.transactions.filter(t=>t.status==="completed" && t.type!=="sent").reduce((s,t)=>s+ Number(t.amount || 0),0);
      const sent = d.transactions.filter(t=>t.status==="completed" && t.type==="sent").reduce((s,t)=>s+ Number(t.amount || 0),0);
      const totalRev = rec - sent;
      statsHtml += `<div class="stat"><div class="stat-ic ic-green"><i class="fas fa-wallet"></i></div><div class="stat-info"><div class="stat-val">${money(totalRev)}</div><div class="stat-lbl">Net Marathon Flow</div></div></div><div class="stat"><div class="stat-ic ic-blue"><i class="fas fa-running"></i></div><div class="stat-info"><div class="stat-val">${d.transactions.length}</div><div class="stat-lbl">Total Marathon Logs</div></div></div>`;
      hasStats = true;
  }
  if (canView('club')) {
      statsHtml += `<div class="stat"><div class="stat-ic ic-purple"><i class="fas fa-users"></i></div><div class="stat-info"><div class="stat-val">${scopedMembers.length}</div><div class="stat-lbl">Active Club Members</div></div></div>`;
      hasStats = true;
  }
  if (canView('gifts')) {
      statsHtml += `<div class="stat"><div class="stat-ic ic-red"><i class="fas fa-gift"></i></div><div class="stat-info"><div class="stat-val">${d.gifts.length}</div><div class="stat-lbl">Rewards Distributed</div></div></div>`;
      hasStats = true;
  }
  statsHtml += '</div>';
  if (!hasStats) statsHtml = `<div class="empty" style="grid-column: 1 / -1"><i class="fas fa-shield-alt"></i>You do not have clearance to view dashboard metrics.</div>`;

  $("pageBody").innerHTML = alertsHtml + switcher() + statsHtml;
}

/* ===== Marathon Payments ===== */
let maraSearch="",marathonFilter="all";
window.setMaraSearch=v=>{ maraSearch=v.toLowerCase(); focusRestore(renderMarathon, 'search_marathon'); };
window.setMaraFilter=v=>{ marathonFilter=v; renderMarathon(); };
function renderMarathon(){
  const d=data();
  let rows=[...d.transactions].sort((a,b)=>new Date(b.date || 0).getTime()-new Date(a.date || 0).getTime());
  if(marathonFilter!=="all") rows=rows.filter(t=>t.type===marathonFilter || (!t.type && marathonFilter==='received'));
  if(maraSearch) rows=rows.filter(t=>(t.customer||"").toLowerCase().includes(maraSearch)||(t.product||"").toLowerCase().includes(maraSearch));
  
  const writeBtn = canWrite('marathon') ? `<button class="btn btn-primary" onclick="txModal()"><i class="fas fa-plus"></i> Log Payment</button>` : '';

  $("pageBody").innerHTML=switcher()+`
    <div class="card">
      <div class="card-head"><span class="card-title">Transaction History</span>${writeBtn}</div>
      <div class="filter-row">
        <input id="search_marathon" class="search" placeholder="Search records..." value="${esc(maraSearch)}" oninput="setMaraSearch(this.value)">
        <select onchange="setMaraFilter(this.value)"><option value="all"${marathonFilter==='all'?' selected':''}>All Types</option><option value="received"${marathonFilter==='received'?' selected':''}>Received (Credit)</option><option value="sent"${marathonFilter==='sent'?' selected':''}>Sent (Debit)</option></select>
      </div>
      <div class="tbl-wrap">${ rows.length?
        `<table><thead><tr><th>Date</th><th>Customer</th><th>Product/Note</th><th>Type</th><th>Amount</th><th>Status</th>${canWrite('marathon')?'<th>Actions</th>':''}</tr></thead><tbody>`+
        rows.map(t=>`<tr>
          <td data-label="Date">${fmtDate(t.date)}</td>
          <td data-label="Customer"><div style="font-weight:700;color:var(--text)">${esc(t.customer)}</div>${t.lastEditedBy ? `<div style="font-size:.7rem;color:var(--text-muted);font-weight:500;margin-top:4px;letter-spacing:0"><i class="fas fa-user-edit" style="font-size:.65rem;margin-right:3px"></i> ${esc(t.lastEditedBy)}</div>` : ''}</td>
          <td data-label="Details">${esc(t.product||"")}${t.notes?`<div style="font-size:.75rem;color:var(--text-muted);margin-top:4px">${esc(t.notes)}</div>`:""}</td>
          <td data-label="Type"><span class="badge ${t.type==='sent'?'bg-red':'bg-green'}">${t.type==='sent'?'Sent (Debit)':'Received (Credit)'}</span></td>
          <td data-label="Amount" style="font-weight:800;font-size:1.05rem;color:${t.type==='sent'?'#dc2626':'#059669'}">${t.type==='sent'?'-':'+'}${money(t.amount)}</td>
          <td data-label="Status"><span class="badge ${t.status==='completed'?'bg-gray':'bg-amber'}">${t.status}</span></td>
          ${canWrite('marathon')?`<td data-label="Actions"><button class="btn btn-sm btn-gray" onclick='txModal(${sj(t)})'><i class="fas fa-pen"></i></button> <button class="btn btn-sm btn-red" onclick="delItem('transactions','${t.id}')"><i class="fas fa-trash"></i></button></td>`:''}
        </tr>`).join("")+`</tbody></table>` : `<div class="empty"><i class="fas fa-running"></i>No marathon payments logged</div>`}</div></div>`;
}
window.txModal=(t={})=>showModal(`
  <div class="modal-head"><h3>${t.id?"Edit":"Log"} Marathon Payment</h3><button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button></div>
  <div class="form-group"><label>Customer Name</label><input id="f_cust" value="${esc(t.customer||"")}"></div>
  <div class="form-group"><label>Product / Description</label><input id="f_prod" value="${esc(t.product||"")}"></div>
  <div class="form-group"><label>Payment Type</label><select id="f_type"><option value="received"${t.type!=='sent'?' selected':''}>Received (Credit)</option><option value="sent"${t.type==='sent'?' selected':''}>Sent (Debit)</option></select></div>
  <div class="form-group"><label>Amount</label><input id="f_amt" type="number" inputmode="numeric" value="${t.amount||""}"></div>
  <div class="form-group"><label>Status</label><select id="f_stat"><option value="completed"${t.status==='completed'?' selected':''}>Completed</option><option value="pending"${t.status==='pending'?' selected':''}>Pending</option></select></div>
  <div class="form-group"><label>Notes</label><textarea id="f_notes">${esc(t.notes||"")}</textarea></div>
  <div class="modal-btns"><button class="btn btn-gray" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick='saveTx("${t.id||""}","${t.date||""}")'>Save Record</button></div>`);
window.saveTx=(id,date)=>{
  const customer=$("f_cust").value.trim(); if(!customer) return toast("Customer name required");
  const status=$("f_stat").value;
  commitItem('transactions', {
    id: id||nid(), customer, product:$("f_prod").value.trim(), type:$("f_type").value, 
    amount:+$("f_amt").value||0, status, notes:$("f_notes").value.trim(), 
    date: date||new Date().toISOString(), completedDate: status==='completed'?new Date().toISOString():null,
    ownerId: viewingAs||currentUser.id, lastEditedBy: getEditor()
  }, id ? "Payment updated" : "Payment added");
};

let clubSearch="",clubFilterCoach="",clubFilterSupervisor="",clubSubTab="all";

window.setClubFilterCoach=v=>{ clubFilterCoach=v; renderClub(); };
window.setClubFilterSupervisor=v=>{ clubFilterSupervisor=v; renderClub(); };

window.autoSelectSup = (cId) => {
    const d = data(); const coach = (d.coaches||[]).find(c=>c.id === cId);
    if(coach && coach.supervisorId) { const supSelect = $('m_sup'); if(supSelect) supSelect.value = coach.supervisorId; }
};

function renderClub(){
  const d=data();

        <button class="seg-btn ${clubSubTab==='kit2'?'active':''}" onclick="setClubSubTab('kit2')" style="${clubSubTab==='kit2'?'color:#fff;background:linear-gradient(135deg, #8b5cf6, #7e22ce);box-shadow:0 4px 10px rgba(139,92,246,.3)':''}"><i class="fas fa-boxes"></i> 2nd Kit Due</button>
      </div>
      <div class="filter-row">
        <input id="search_club" class="search" placeholder="Search members..." value="${esc(clubSearch)}" oninput="setClubSearch(this.value)">
        <select onchange="setClubFilterCoach(this.value)"><option value="">All Coaches</option>${coaches.map(c=>`<option value="${c.id}"${clubFilterCoach===c.id?' selected':''}>${esc(c.name)}</option>`).join("")}</select>
        <select onchange="setClubFilterSupervisor(this.value)"><option value="">All Supervisors</option>${supervisors.map(s=>`<option value="${s.id}"${clubFilterSupervisor===s.id?' selected':''}>${esc(s.name)}</option>`).join("")}</select>
      </div>
      <div class="tbl-wrap">${ rows.length?
        `<table><thead><tr><th>Name</th><th>Contact</th><th>Coach</th><th>Supervisor</th><th>Payment</th><th>Join Date</th><th>Kits Progress</th>${canWrite('club')?'<th>Actions</th>':''}</tr></thead><tbody>`+
        rows.map(m=>{
          const cName = m.coachId ? (coaches.find(x=>x.id===m.coachId)?.name || m.coachName) : m.coachName;
          const sName = m.supervisorId ? (supervisors.find(x=>x.id===m.supervisorId)?.name || m.supervisorName) : m.supervisorName;
          return `<tr>
          <td data-label="Name"><div style="font-weight:700;color:var(--text)">${esc(m.name)}</div>${m.lastEditedBy ? `<div style="font-size:.7rem;color:var(--text-muted);font-weight:500;margin-top:4px;letter-spacing:0"><i class="fas fa-user-edit" style="font-size:.65rem;margin-right:3px"></i> ${esc(m.lastEditedBy)}</div>` : ''}</td>
          <td data-label="Contact">
             <div style="display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end">
               <span style="white-space:nowrap">${esc(m.phone||"-")}</span> 
               ${m.phone && m.phone.trim()!=="-" ?`<a href="tel:${esc(m.phone)}" class="btn btn-sm btn-blue" style="padding:4px 8px;border-radius:6px;min-width:28px" title="Call"><i class="fas fa-phone"></i></a>`:''}
               ${m.email && m.email.trim()!=="-" ?`<a href="mailto:${esc(m.email)}" class="btn btn-sm btn-amber" style="padding:4px 8px;border-radius:6px;min-width:28px" title="Email"><i class="fas fa-envelope"></i></a>`:''}
             </div>

          <td data-label="Coach">${esc(cName||"-")}</td>
          <td data-label="Supervisor">${esc(sName||"-")}</td>
          <td data-label="Payment"><b>${money(m.paymentToCoach||0)}</b>${m.paymentReceiver?`<br><small style="color:var(--text-muted)">Rec: ${esc(m.paymentReceiver)}</small>`:''}</td>
          <td data-label="Join Date">${fmtDate(m.joinDate)}</td>
          <td data-label="Kits Progress"><div style="display:flex;gap:4px;flex-direction:column"><span class="badge ${m.firstKit==='completed'?'bg-green':'bg-amber'}">Kit 1: ${m.firstKit||'pending'}</span><span class="badge ${m.secondKit==='completed'?'bg-green':'bg-amber'}">Kit 2: ${m.secondKit||'pending'}</span></div></td>
          ${canWrite('club')?`<td data-label="Actions">

      rows.length? `<div class="stats" style="margin-bottom:0"><div class="stat"><div class="stat-ic ic-teal"><i class="fas fa-box"></i></div><div class="stat-info"><div class="stat-val">${k1}/${rows.length}</div><div class="stat-lbl">Kit 1 Completed</div></div></div><div class="stat"><div class="stat-ic ic-purple"><i class="fas fa-boxes-stacked"></i></div><div class="stat-info"><div class="stat-val">${k2}/${rows.length}</div><div class="stat-lbl">Kit 2 Completed</div></div></div></div>`
      : `<div class="empty" style="padding:20px"><i class="fas fa-box"></i>No kit data available</div>`}</div>`;

window.saveMember=(id,joinDate)=>{
  const name=$("m_name").value.trim(); if(!name) return toast("Name required");
  const d=data();
  if(d.members.some(m=>m.id!==id && m.name.toLowerCase()===name.toLowerCase()) && !confirm(`Member "${name}" exists. Add anyway?`)) return;
  const coachId=$("m_coach").value, supId=$("m_sup").value;
  commitItem('members', {
    id: id||nid(), name, phone:$("m_phone").value.trim(), email:$("m_email").value.trim(),
    coachId, coachName: coachId ? (d.coaches||[]).find(c=>c.id===coachId)?.name : "",
    supervisorId: supId, supervisorName: supId ? (d.supervisors||[]).find(s=>s.id===supId)?.name : "",
    paymentToCoach: +$("m_pay").value||0, paymentReceiver: $("m_receiver").value.trim(),
    firstKit: $("m_k1").value, secondKit: $("m_k2").value, notes: $("m_notes").value.trim(),
    joinDate: joinDate||new Date().toISOString(), ownerId: viewingAs||currentUser.id, lastEditedBy: getEditor()
  }, id ? "Member updated" : "Member added");
};

window.autoFillSupLogin = () => {
  const name = $("s_name").value.trim();

window.saveSup=id=>{
  const name=$("s_name").value.trim(); if(!name) return toast("Supervisor Name required");
  const supId=$("s_sup").value;
  const finalId = id || nid();
  if(id && supId){
    // A supervisor can't be placed under someone who is already in their own downline chain —
    // that would create a loop (e.g. D ends up supervising A who supervises ... who supervises D).
    const downline = getDownlineSupervisorIds(id, data().supervisors||[]);
    if(downline.has(supId)) return toast("Can't do that — this would create a circular supervisor chain");
  }

  // Manual login ID / PIN handling — works for brand-new supervisors and for editing an
  // existing one's login the same way, instead of only through the rank-promotion flow.
  const uname = $("s_user").value.trim(), pin = $("s_pin").value.trim();
  const existingIdx = DB.users.findIndex(u => u.linkedId === finalId);
  if (uname) {
    const dupe = DB.users.find((u,i) => i !== existingIdx && u.username.toLowerCase() === uname.toLowerCase());
    if (dupe) return toast("That Login ID is already taken by another account");
    if (pin && pin.length < 4) return toast("PIN must be at least 4 digits");
    if (existingIdx >= 0) {
      const oldId = DB.users[existingIdx].id;
      if (oldId !== uname) {
        // Renaming the login ID — carry the profile/personal data over to the new key so
        // nothing gets lost, and keep the active session in sync if this is the logged-in user.
        DB.profiles[uname] = DB.profiles[oldId] || { displayName: name, theme: "light", dateFormat: "UK" };
        delete DB.profiles[oldId];
        DB.perUser[uname] = DB.perUser[oldId] || { transactions: [], members: [], gifts: [], coaches: [], supervisors: [] };
        delete DB.perUser[oldId];
        if (currentUser && currentUser.id === oldId) currentUser.id = uname;
        if (viewingAs === oldId) viewingAs = uname;
        if (sessionStorage.getItem("mm_session") === oldId) sessionStorage.setItem("mm_session", uname);
        if (localStorage.getItem("mm_remembered_session") === oldId) localStorage.setItem("mm_remembered_session", uname);
      }
      DB.users[existingIdx].id = uname;
      DB.users[existingIdx].username = uname;
      if (pin) DB.users[existingIdx].pin = pin;
    } else {
      if (!pin || pin.length < 4) return toast("Set a PIN (min 4 digits) to create this login");
      if (!DB.permissions['supervisor']) DB.permissions['supervisor'] = { dashboard:"view", marathon:"hidden", club:"write", coaches:"write", supervisors:"write", gifts:"hidden", backup:"hidden" };
      DB.users.push({ id: uname, username: uname, pin, role: 'supervisor', linkedId: finalId });
      DB.profiles[uname] = { displayName: name, phone: $("s_phone").value.trim(), email: $("s_email").value.trim(), bio: "", theme: "light", dateFormat: "UK" };
      DB.perUser[uname] = { transactions: [], members: [], gifts: [], coaches: [], supervisors: [] };
    }
  } else if (existingIdx >= 0) {
    const uId = DB.users[existingIdx].id;
    DB.users.splice(existingIdx, 1);
    delete DB.profiles[uId]; delete DB.perUser[uId];
  }

  commitItem('supervisors', {
    id: finalId, name, phone:$("s_phone").value.trim(), email:$("s_email").value.trim(),
    supervisorId: supId, supervisorName: supId ? data().supervisors.find(x=>x.id===supId)?.name : "",
    status:$("s_stat").value, ownerId: viewingAs||currentUser.id, lastEditedBy: getEditor()
  }, id ? "Supervisor updated" : "Supervisor added");
};

const MERGE_LABELS = { members:{title:"Club Members", icon:"fa-users"}, coaches:{title:"Coaches", icon:"fa-user-tie"}, supervisors:{title:"Supervisors", icon:"fa-user-shield"} };
window.mergeModal = (type) => {
  const d = data();
  const list = [...(d[type]||[])].sort((a,b)=>(a.name||"").localeCompare(b.name||""));
  const opts = list.map(x=>`<option value="${x.id}">${esc(x.name)}${x.phone?` (${esc(x.phone)})`:''}</option>`).join("");
  showModal(`
  <div class="modal-head"><h3><i class="fas ${MERGE_LABELS[type].icon}"></i> Merge ${MERGE_LABELS[type].title}</h3><button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button></div>
  <p style="font-size:.85rem;color:var(--text-muted);margin-bottom:16px;line-height:1.4">Pick the duplicate record to remove and the record to keep. Every member, coach, or supervisor linked to the duplicate is automatically re-pointed to the record you keep before it's deleted — nothing gets orphaned.</p>
  <div class="form-group"><label>Keep This Record</label><select id="merge_keep"><option value="">-- Select --</option>${opts}</select></div>
  <div class="form-group"><label>Merge & Delete This Record</label><select id="merge_dupe"><option value="">-- Select --</option>${opts}</select></div>
  <div class="modal-btns"><button class="btn btn-gray" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="confirmMerge('${type}')"><i class="fas fa-object-ungroup"></i> Merge</button></div>`);
};
window.confirmMerge = (type) => {
  const keepId = $("merge_keep").value, dupeId = $("merge_dupe").value;
  if(!keepId || !dupeId) return toast("Select both records");
  if(keepId === dupeId) return toast("Choose two different records");
  const d = data();
  const keep = d[type].find(x=>x.id===keepId), dupe = d[type].find(x=>x.id===dupeId);
  if(!keep || !dupe) return toast("Record not found");
  if(!confirm(`Merge "${dupe.name}" into "${keep.name}"? This can't be undone.`)) return;

  // Fill in any blank fields on the kept record using the duplicate's data.
  ["phone","email","notes","supervisorId","supervisorName","coachId","coachName","paymentReceiver"].forEach(f=>{
    if(!keep[f] && dupe[f]) keep[f] = dupe[f];
  });

  if(type === "coaches"){
    (d.members||[]).forEach(m=>{ if(m.coachId===dupeId){ m.coachId=keepId; m.coachName=keep.name; } });
  } else if(type === "supervisors"){
    (d.coaches||[]).forEach(c=>{ if(c.supervisorId===dupeId){ c.supervisorId=keepId; c.supervisorName=keep.name; } });
    (d.members||[]).forEach(m=>{ if(m.supervisorId===dupeId){ m.supervisorId=keepId; m.supervisorName=keep.name; } });
    (d.supervisors||[]).forEach(s=>{ if(s.supervisorId===dupeId){ s.supervisorId=keepId; s.supervisorName=keep.name; } });
    (DB.users||[]).forEach(u=>{ if(u.linkedId===dupeId) u.linkedId=keepId; });
  }
  d[type] = d[type].filter(x=>x.id!==dupeId);
  save(true); closeModal(); render();
  toast(`Merged "${dupe.name}" into "${keep.name}"`);
};

/* ===== Excel/CSV Client Import ===== */
let excelImportRows=[];
function pickField(row, keys){
  const map={}; Object.keys(row).forEach(k=>map[k.toLowerCase().trim()]=row[k]);
  for(const k of keys){ if(map[k]!==undefined && map[k]!=="") return map[k]; }
  return "";
}
window.importExcel=e=>{
  const f=e.target.files[0]; if(!f) return;
  if(typeof XLSX==="undefined"){ toast("Excel library failed to load — check your connection"); e.target.value=""; return; }
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const wb=XLSX.read(ev.target.result,{type:"array"});
      const sheet=wb.Sheets[wb.SheetNames[0]];
      const json=XLSX.utils.sheet_to_json(sheet,{defval:""});
      if(!json.length){ toast("No rows found in that file"); return; }
      const d=data();
      excelImportRows=json.map(row=>{
        const name=String(pickField(row,["name","member name","customer name","client name","full name"])).trim();
        const phone=String(pickField(row,["phone","mobile","contact","phone number","mobile number"])).trim();
        const email=String(pickField(row,["email","email address"])).trim();
        const coachName=String(pickField(row,["coach","coach name"])).trim();
        const supervisorName=String(pickField(row,["supervisor","supervisor name"])).trim();
        const paymentToCoach=+pickField(row,["payment","paymenttocoach","payment to coach","amount"])||0;
        const paymentReceiver=String(pickField(row,["receiver","payment receiver","paymentreceiver"])).trim();
        const firstKit=/complet/i.test(String(pickField(row,["kit1","first kit","firstkit"])))?"completed":"pending";
        const secondKit=/complet/i.test(String(pickField(row,["kit2","second kit","secondkit"])))?"completed":"pending";
        const notes=String(pickField(row,["notes","note","remarks"])).trim();
        const joinRaw=pickField(row,["joindate","join date","date"]);
        let joinDate=new Date().toISOString();
        if(joinRaw){ const parsed=new Date(joinRaw); if(!isNaN(parsed)) joinDate=parsed.toISOString(); }
        const match=(d.members||[]).find(m=>(phone && m.phone && m.phone.trim()===phone) || (name && m.name && m.name.toLowerCase().trim()===name.toLowerCase()));
        const coach=(d.coaches||[]).find(c=>c.name && coachName && c.name.toLowerCase()===coachName.toLowerCase());
        const supervisor=(d.supervisors||[]).find(s=>s.name && supervisorName && s.name.toLowerCase()===supervisorName.toLowerCase());
        return {name,phone,email,coachName,coachId:coach?coach.id:"",supervisorName,supervisorId:supervisor?supervisor.id:"",paymentToCoach,paymentReceiver,firstKit,secondKit,notes,joinDate,match,action:match?"ask":"new"};
      }).filter(r=>r.name);
      if(!excelImportRows.length){ toast("No rows had a recognizable Name column"); return; }
      showExcelImportModal();
    }catch(err){ toast("Could not read file: "+err.message); }
  };
  reader.readAsArrayBuffer(f);
  e.target.value="";
};
function showExcelImportModal(){
  const conflicts=excelImportRows.filter(r=>r.match);
  const fresh=excelImportRows.filter(r=>!r.match);
  showModal(`
    <div class="modal-head"><h3>Import Client Data</h3><button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button></div>
    <p style="font-size:.85rem;color:var(--text-muted);margin-bottom:14px">${excelImportRows.length} row(s) found — <b>${fresh.length}</b> new, <b>${conflicts.length}</b> matching an existing member by name/phone.</p>
    ${conflicts.length?`
    <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">
      <button class="btn btn-sm btn-blue" onclick="setAllExcelActions('override')">Override All Matches</button>
      <button class="btn btn-sm btn-primary" onclick="setAllExcelActions('new')">Add All As New</button>
      <button class="btn btn-sm btn-gray" onclick="setAllExcelActions('skip')">Skip All Matches</button>
    </div>
    <div style="max-height:280px;overflow-y:auto;border:1px solid var(--border);border-radius:10px;padding:4px 10px;margin-bottom:14px">
    ${conflicts.map(r=>{ const gi=excelImportRows.indexOf(r); return `
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid #f1f5f9">
        <div><b>${esc(r.name)}</b><br><small style="color:var(--text-muted)">${esc(r.phone||"no phone")} — matches existing "${esc(r.match.name)}"</small></div>
        <select onchange="setExcelAction(${gi},this.value)" style="font-size:.8rem;padding:5px 8px;flex-shrink:0">
          <option value="skip"${r.action==='skip'?' selected':''}>Skip</option>
          <option value="override"${r.action==='override'?' selected':''}>Override existing</option>
          <option value="new"${r.action==='new'?' selected':''}>Add as new customer</option>
        </select>
      </div>`; }).join("")}
    </div>`:''}
    <div class="modal-btns"><button class="btn btn-gray" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="confirmExcelImport()"><i class="fas fa-check"></i> Import ${excelImportRows.length} Row(s)</button></div>
  `);
}
window.setExcelAction=(idx,val)=>{ excelImportRows[idx].action=val; };
window.setAllExcelActions=val=>{ excelImportRows.forEach(r=>{ if(r.match) r.action=val; }); showExcelImportModal(); };
window.confirmExcelImport=()=>{
  const d=data();
  let added=0, overridden=0, skipped=0;
  excelImportRows.forEach(r=>{
    if(r.match && r.action==="skip"){ skipped++; return; }
    const base={name:r.name,phone:r.phone,email:r.email,coachId:r.coachId,coachName:r.coachName,supervisorId:r.supervisorId,supervisorName:r.supervisorName,paymentToCoach:r.paymentToCoach,paymentReceiver:r.paymentReceiver,firstKit:r.firstKit,secondKit:r.secondKit,notes:r.notes,joinDate:r.joinDate,ownerId:viewingAs||currentUser.id,lastEditedBy:getEditor()};
    if(r.match && r.action==="override"){
      const i=d.members.findIndex(m=>m.id===r.match.id);
      if(i>=0){ d.members[i]={...r.match,...base,id:r.match.id}; overridden++; }
    } else {
      d.members.push({...base,id:nid()});
      added++;
    }
  });
  save(true); excelImportRows=[]; closeModal(); render();
  toast(`Import complete: ${added} added, ${overridden} overridden, ${skipped} skipped`);
};

window.delUser=id=>{

  if (target.role === 'admin' && !isSuperAdmin()) { toast("Insufficient clearance to delete Admin"); return; }
  if(!confirm("Warning: Purging this account will permanently destroy their isolated data. Proceed?"))return; 
  DB.users=DB.users.filter(u=>u.id!==id); delete DB.profiles[id]; delete DB.perUser[id]; 
  save(true); render(); toast("Account successfully purged"); 
};

window.saveUser=id=>{
  const name=$("u_name").value.trim(), pin=$("u_pin").value.trim();
  const usernameField = $("u_user").value.trim().toLowerCase();
  let role = $("u_role") ? $("u_role").value : 'user';
  const linkedId = $("u_link").value;

  if(pin.length<4){ toast("Access Code must be 4+ digits"); return; }
  if(id){ 
    const u=DB.users.find(x=>x.id===id); 
    if (u.id !== currentUser.id && !isSuperAdmin() && u.role === 'superadmin') { toast("Clearance check failed"); return; }
    if (!isSuperAdmin() && u.id === currentUser.id) role = u.role; 
    if (isSuperAdmin() && usernameField) {
        if(DB.users.some(x=>x.username===usernameField && x.id!==id)){ toast("System ID conflict detected"); return; }
        u.username = usernameField;
    }
    u.pin=pin; u.role=role; u.linkedId=linkedId; DB.profiles[id].displayName=name||u.username; 
  } else { 
    if(!usernameField){toast("System ID is required");return;} 
    if(DB.users.some(u=>u.username===usernameField)){toast("System ID conflict detected");return;}
    const newU={id:usernameField,username:usernameField,pin,role,linkedId}; 
    DB.users.push(newU); 
    DB.profiles[usernameField]={displayName:name||usernameField,phone:"",email:"",bio:"",theme:"light",dateFormat:"UK"}; 
    DB.perUser[usernameField]={transactions:[],members:[],gifts:[],coaches:[],supervisors:[]}; 
  }
  save(true); closeModal(); render(); toast("Configuration applied");
};

/* ===== Profile ===== */
function renderProfile(){
  const p=DB.profiles[currentUser.id]||{};
  $("pageBody").innerHTML=`
    <div class="profile-banner"><div class="profile-av">${(p.displayName||currentUser.username)[0].toUpperCase()}</div><div><h3 style="font-size:1.8rem;font-weight:800;letter-spacing:-0.5px">${esc(p.displayName||currentUser.username)}</h3><p style="opacity:.9;font-size:.85rem;text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-top:6px">${currentUser.role.toUpperCase()} LEVEL CLEARANCE</p></div></div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:30px">
      <div class="card" style="margin-bottom:0"><div class="card-head"><span class="card-title">Identity Parameters</span></div>
        <div class="form-group"><label>Display Alias</label><input id="p_name" value="${esc(p.displayName||"")}"></div>
        <div class="form-group"><label>Direct Contact Line</label><input id="p_phone" value="${esc(p.phone||"")}"></div>
        <div class="form-group"><label>Encrypted Email</label><input id="p_email" value="${esc(p.email||"")}"></div>
        <div class="form-group"><label>Operational Notes</label><textarea id="p_bio">${esc(p.bio||"")}</textarea></div>
        <button class="btn btn-primary" style="width:100%" onclick="saveProfile()">Commit Identity Changes</button>
      </div>
      <div class="card" style="margin-bottom:0"><div class="card-head"><span class="card-title">Interface Preferences</span></div>
        <div class="form-group"><label>Chronological Format Standard</label><select id="p_date"><option value="UK"${p.dateFormat==='UK'?' selected':''}>EU/UK Standard (DD/MM/YYYY)</option><option value="US"${p.dateFormat==='US'?' selected':''}>US Standard (MM/DD/YYYY)</option><option value="ISO"${p.dateFormat==='ISO'?' selected':''}>ISO Standard (YYYY-MM-DD)</option></select></div>
        <button class="btn btn-blue" style="width:100%" onclick="savePrefs()">Apply Standard</button>
      </div>
    </div>`;
}
window.saveProfile=()=>{ const p=DB.profiles[currentUser.id]; p.displayName=$("p_name").value.trim()||currentUser.username; p.phone=$("p_phone").value.trim(); p.email=$("p_email").value.trim(); p.bio=$("p_bio").value.trim(); save(true); render(); toast("Identity matrix updated"); };
window.savePrefs=()=>{ DB.profiles[currentUser.id].dateFormat=$("p_date").value; save(true); render(); toast("Interface standards applied"); };

/* ===== Settings ===== */
function renderSettings(){
  $("pageBody").innerHTML=`
    <div class="card" style="max-width:600px;margin:0 auto"><div class="card-head"><span class="card-title"><i class="fas fa-key" style="color:var(--primary);margin-right:10px"></i> Authentication Security</span></div>
      <div class="form-group"><label>Current Access Code</label><input id="s_cur" inputmode="numeric" type="password"></div>
      <div class="form-group"><label>New Access Code (4-6 Digits)</label><input id="s_new" inputmode="numeric" type="password"></div>
      <div class="form-group"><label>Verify New Access Code</label><input id="s_conf" inputmode="numeric" type="password"></div>
      <button class="btn btn-primary" style="width:100%;margin-top:10px" onclick="changePin()">Update Security Code</button>
    </div>`;
}
window.changePin=()=>{
  const c=$("s_cur").value.trim(),n=$("s_new").value.trim(),cf=$("s_conf").value.trim();
  if(c!==currentUser.pin){ toast("Current security code invalid"); return; }
  if(n.length<4){ toast("Security code requires 4+ digits"); return; }
  if(n!==cf){ toast("Verification mismatch"); return; }
  DB.users.find(u=>u.id===currentUser.id).pin=n; currentUser.pin=n; save(true); render(); toast("Security code updated successfully");
};

/* ===== Modal plumbing ===== */
function showModal(html){ $("modalRoot").innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`; }
window.closeModal=()=>{ $("modalRoot").innerHTML=""; };

/* ===== Start ===== */
load(); startCloud();
// If the last session ended before its edit finished syncing (app closed/crashed/offline),
// push it now so nothing gets silently overwritten by the next cloud snapshot.
if(isDirty) cloudSave(true);
const sess=sessionStorage.getItem("mm_session") || localStorage.getItem("mm_remembered_session");
if(sess){ 
    const u=DB.users.find(x=>x.id===sess); 
    if(u){ 
        currentUser=u; viewingAs=u.id; 
        sessionStorage.setItem("mm_session", u.id); 
        $("loginPage").classList.add("hidden"); 
        $("appShell").classList.remove("hidden"); 
        buildNav(); 
        render(); 
    } else {
        sessionStorage.removeItem("mm_session"); 
        localStorage.removeItem("mm_remembered_session");
        document.documentElement.classList.remove("authed");
    }
}
</script>
</body>
</html>
